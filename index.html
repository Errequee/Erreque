<script>
/* Boot defensively. Scripts above are inline, but some hosts (Cloudflare's
   Rocket Loader, for one) rewrite or defer inline scripts, which can leave the
   page blank with nothing to explain it. Wait for the globals, then say so
   plainly if they never arrive - a visible message beats a white screen. */
(function boot(tries) {
  'use strict';
  function fail(msg) {
    document.body.innerHTML =
      '<div style="max-width:36em;margin:12vh auto;padding:0 24px;' +
      'font:16px/1.6 system-ui,-apple-system,sans-serif;color:#191512">' +
      '<h1 style="font-size:26px;margin:0 0 10px">Open Press could not start</h1>' +
      '<p style="color:#615749">' + msg + '</p>' +
      '<p style="color:#615749">This page is one self-contained file. If you are viewing it ' +
      'through a preview pane or an embed, try opening it in its own browser tab.</p></div>';
  }
  if (window.NV && window.IM) {
    try { NV.start(); } catch (e) { fail('It loaded but failed while starting: ' + e.message); }
    return;
  }
  if (tries > 120) { return fail('Its scripts did not run. Something on the host may be rewriting or blocking inline scripts.'); }
  setTimeout(function () { boot(tries + 1); }, 50);
})(0);
</script>
