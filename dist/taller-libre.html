<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller Libre — Herramientas DTF gratis</title>
<meta name="description" content="13 herramientas gratuitas para impresión DTF, serigrafía y vinil: quitar fondos, reducir bordes, semitonos, vectorizar, hojas de impresión, mockups y calculadora de precios. Todo corre en tu navegador.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF2D7E' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='6.2'/%3E%3Cpath d='M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Taller Serigrafía Libre — sistema visual */

:root{
  color-scheme: dark;
  --ground:#13110F;
  --sheet:#1B1815;
  --raise:#232019;
  --sunk:#0E0C0B;
  --line:#342E27;
  --line-soft:#262119;
  --text:#F3EEE6;
  --dim:#A99E8F;
  --mute:#7B7266;
  --registro:#FF2D7E;
  --registro-soft:rgba(255,45,126,.14);
  --on-registro:#1A0710;
  --cian:#2BBBD8;
  --amarillo:#F2B01E;
  --ok:#4FD08A;
  --bad:#FF6B5C;
  --check-a:#2A2521;
  --check-b:#211D19;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.9);
  --rail:340px;
  --r-sm:3px; --r-md:6px; --r-lg:10px;
  --f-display:'Archivo','Archivo Black',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --ground:#F4F0E7; --sheet:#FFFDF8; --raise:#EDE7DA; --sunk:#E4DDCE;
    --line:#D8CFBD; --line-soft:#E6DFD1;
    --text:#191512; --dim:#615749; --mute:#8A8073;
    --registro:#D1005F; --registro-soft:rgba(209,0,95,.10); --on-registro:#FFF;
    --cian:#0B7C96; --amarillo:#9A6B00; --ok:#1E7B4E; --bad:#C0392B;
    --check-a:#E8E1D3; --check-b:#F4F0E7;
    --shadow:0 1px 2px rgba(80,66,44,.10), 0 12px 30px -20px rgba(80,66,44,.5);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground:#F4F0E7; --sheet:#FFFDF8; --raise:#EDE7DA; --sunk:#E4DDCE;
  --line:#D8CFBD; --line-soft:#E6DFD1;
  --text:#191512; --dim:#615749; --mute:#8A8073;
  --registro:#D1005F; --registro-soft:rgba(209,0,95,.10); --on-registro:#FFF;
  --cian:#0B7C96; --amarillo:#9A6B00; --ok:#1E7B4E; --bad:#C0392B;
  --check-a:#E8E1D3; --check-b:#F4F0E7;
  --shadow:0 1px 2px rgba(80,66,44,.10), 0 12px 30px -20px rgba(80,66,44,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:800; text-wrap:balance; margin:0; line-height:1.04; letter-spacing:-.015em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--registro); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--mute);
}

/* ---------- barra superior ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:18px;
  padding:0 18px; height:56px;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; flex:none}
.brand .mark{width:26px;height:26px;flex:none;color:var(--registro)}
.brand b{font-family:var(--f-display); font-weight:800; font-size:17px; letter-spacing:.01em; text-transform:uppercase}
.brand span{font-family:var(--f-mono); font-size:10px; letter-spacing:.18em; color:var(--mute); text-transform:uppercase}
.topnav{display:flex; align-items:center; gap:4px; margin-left:auto}
.topnav a,.iconbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px; border-radius:var(--r-md); text-decoration:none;
  font-size:13px; color:var(--dim); border:1px solid transparent;
  background:none; cursor:pointer;
}
.topnav a:hover,.iconbtn:hover{color:var(--text); background:var(--raise)}
.topnav a.on{color:var(--text); border-color:var(--line); background:var(--sheet)}
.iconbtn svg{width:16px;height:16px}

/* menú de herramientas */
.picker{position:relative}
.picker-menu{
  position:absolute; right:0; top:calc(100% + 8px); width:min(560px,92vw);
  background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow); padding:8px; display:none;
  grid-template-columns:1fr 1fr; gap:2px; max-height:70vh; overflow:auto;
}
.picker.open .picker-menu{display:grid}
.picker-menu a{
  display:block; padding:8px 10px; border-radius:var(--r-md);
  text-decoration:none; font-size:13.5px; line-height:1.3;
}
.picker-menu a small{display:block; color:var(--mute); font-size:11.5px}
.picker-menu a:hover{background:var(--raise)}
.picker-menu .head{grid-column:1/-1; padding:10px 10px 4px}

/* ---------- portada ---------- */
.ruler{height:26px; border-bottom:1px solid var(--line); position:relative; overflow:hidden; background:var(--sunk)}
.ruler::before{
  content:''; position:absolute; inset:0;
  background:
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 20px),
    repeating-linear-gradient(90deg, color-mix(in srgb,var(--registro) 55%, transparent) 0 1px, transparent 1px 100px);
  background-position:0 60%, 0 0;
  background-size:auto 40%, auto 100%;
  background-repeat:repeat-x;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 22px}
.hero{position:relative; padding:64px 0 40px; overflow:hidden}
.hero canvas{position:absolute; inset:0; width:100%; height:100%; opacity:.5; pointer-events:none}
.hero-in{position:relative; max-width:44ch}
.hero h1{font-size:clamp(38px,6.4vw,74px); text-transform:uppercase; letter-spacing:-.03em}
.hero h1 em{font-style:normal; color:var(--registro)}
.hero p{color:var(--dim); font-size:17px; margin:16px 0 0; max-width:52ch}
.badges{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.badge{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:100px; padding:5px 11px; color:var(--dim);
  background:var(--sheet);
}
.badge.hot{border-color:var(--registro); color:var(--registro); background:var(--registro-soft)}

.sheet-head{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  padding:34px 0 14px; border-bottom:1px solid var(--line); margin-bottom:22px;
}
.sheet-head h2{font-size:22px; text-transform:uppercase; letter-spacing:.02em}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px; padding-bottom:26px}
.card{
  position:relative; display:flex; flex-direction:column; gap:9px;
  padding:18px; text-decoration:none;
  background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg);
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.card:hover{transform:translateY(-2px); border-color:color-mix(in srgb,var(--registro) 55%,var(--line)); box-shadow:var(--shadow)}
.card .ico{width:30px;height:30px;color:var(--registro)}
.card h3{font-size:16.5px; letter-spacing:0; font-weight:700}
.card p{margin:0; color:var(--dim); font-size:13.5px; line-height:1.45}
.card .num{
  position:absolute; top:14px; right:16px;
  font-family:var(--f-mono); font-size:11px; color:var(--mute);
}
.card::after{
  content:''; position:absolute; left:0; top:14px; bottom:14px; width:2px;
  background:var(--registro); opacity:0; border-radius:2px; transition:opacity .16s;
}
.card:hover::after{opacity:.85}

/* ---------- banco de trabajo ---------- */
.bench{display:grid; grid-template-columns:var(--rail) 1fr; height:calc(100vh - 56px)}
.rail{
  border-right:1px solid var(--line); background:var(--sheet);
  overflow-y:auto; display:flex; flex-direction:column;
}
.rail-head{padding:18px 18px 14px; border-bottom:1px solid var(--line-soft)}
.rail-head h1{font-size:21px; text-transform:uppercase; letter-spacing:.01em}
.rail-head p{margin:7px 0 0; color:var(--dim); font-size:13px}
.rail-body{padding:14px 18px 18px; display:flex; flex-direction:column; gap:15px; flex:1}
.rail-foot{
  position:sticky; bottom:0; padding:12px 18px;
  border-top:1px solid var(--line); background:var(--sheet);
  display:flex; flex-direction:column; gap:8px;
}
.stage{position:relative; background:var(--sunk); overflow:hidden; display:flex; flex-direction:column}

/* controles */
.field{display:flex; flex-direction:column; gap:7px}
.field > label,.flabel{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  font-size:12.5px; color:var(--dim);
}
.flabel b{font-family:var(--f-mono); font-size:12px; color:var(--text); font-weight:500; font-variant-numeric:tabular-nums}
.hint{font-size:11.5px; color:var(--mute); line-height:1.4; margin:0}
.sep{height:1px; background:var(--line-soft); margin:2px 0}
.group-t{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--mute); margin-top:4px;
}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:18px; background:none; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:3px; background:var(--line); border-radius:3px}
input[type=range]::-moz-range-track{height:3px; background:var(--line); border-radius:3px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px;height:15px;border-radius:50%;
  background:var(--registro); margin-top:-6px; border:2px solid var(--sheet);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--registro);border:2px solid var(--sheet)
}
input[type=text],input[type=number],select,textarea{
  width:100%; padding:8px 10px; background:var(--ground);
  border:1px solid var(--line); border-radius:var(--r-md); font-size:13.5px;
}
input[type=number]{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
select{cursor:pointer}
.seg{display:flex; background:var(--ground); border:1px solid var(--line); border-radius:var(--r-md); padding:2px; gap:2px}
.seg button{
  flex:1; padding:6px 4px; font-size:12.5px; border:0; border-radius:4px;
  background:none; color:var(--dim); cursor:pointer; white-space:nowrap;
}
.seg button.on{background:var(--registro); color:var(--on-registro); font-weight:600}
.seg button:hover:not(.on){color:var(--text)}
.check{display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer; color:var(--dim)}
.check input{accent-color:var(--registro); width:15px;height:15px; cursor:pointer}
.check:hover{color:var(--text)}
.row{display:flex; gap:8px} .row > *{flex:1; min-width:0}
.swatch{
  width:100%; height:32px; padding:0; border:1px solid var(--line);
  border-radius:var(--r-md); background:none; cursor:pointer;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 14px; border-radius:var(--r-md); border:1px solid var(--line);
  background:var(--raise); color:var(--text); font-size:13.5px; font-weight:600;
  cursor:pointer; text-decoration:none; transition:filter .12s, border-color .12s;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.primary{background:var(--registro); color:var(--on-registro); border-color:var(--registro)}
.btn.ghost{background:none}
.btn.wide{width:100%}
.btn svg{width:15px;height:15px}

/* zona de carga */
.drop{
  flex:1; margin:20px; border:1.5px dashed var(--line); border-radius:var(--r-lg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center; padding:30px; cursor:pointer; color:var(--dim);
  transition:border-color .15s, background .15s;
}
.drop:hover,.drop.over{border-color:var(--registro); background:var(--registro-soft); color:var(--text)}
.drop svg{width:38px;height:38px; color:var(--mute)}
.drop.over svg,.drop:hover svg{color:var(--registro)}
.drop b{font-family:var(--f-display); font-size:18px; text-transform:uppercase}
.drop small{font-size:12px; color:var(--mute); max-width:38ch}

/* visor */
.viewer{flex:1; position:relative; overflow:hidden; cursor:grab}
.viewer.drag{cursor:grabbing}
.plate{position:absolute; left:50%; top:50%; transform-origin:0 0; will-change:transform}
.plate{
  background-image:
    linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),
    linear-gradient(45deg,var(--check-a) 25%,var(--check-b) 25%,var(--check-b) 75%,var(--check-a) 75%);
  background-size:18px 18px; background-position:0 0,9px 9px;
}
.plate canvas{position:absolute; left:0; top:0; display:block; image-rendering:pixelated}
.plate.smooth canvas{image-rendering:auto}
.plate .divider{
  position:absolute; top:0; bottom:0; width:1px; background:var(--registro);
  box-shadow:0 0 0 1px rgba(0,0,0,.35); display:none;
}
.viewer.cmp .divider{display:block}
.toolbar{
  position:absolute; left:12px; bottom:12px; z-index:5; display:flex; gap:4px;
  background:color-mix(in srgb,var(--sheet) 92%,transparent); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:var(--r-md); padding:4px;
}
.toolbar button{
  min-width:32px; height:30px; padding:0 9px; border:0; border-radius:4px;
  background:none; color:var(--dim); cursor:pointer; font-size:12px;
  font-family:var(--f-mono); display:inline-flex; align-items:center; justify-content:center;
}
.toolbar button:hover{background:var(--raise); color:var(--text)}
.toolbar button.on{background:var(--registro); color:var(--on-registro)}
.meta{
  position:absolute; right:12px; bottom:12px; z-index:5;
  font-family:var(--f-mono); font-size:11px; color:var(--mute);
  background:color-mix(in srgb,var(--sheet) 92%,transparent);
  border:1px solid var(--line); border-radius:var(--r-md); padding:6px 10px;
}
.busy{
  position:absolute; inset:0; z-index:8; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:12px;
  background:color-mix(in srgb,var(--sunk) 72%,transparent);
  font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
}
.busy.on{display:flex}
.spin{
  width:28px;height:28px;border:2px solid var(--line); border-top-color:var(--registro);
  border-radius:50%; animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .spin{animation-duration:2s}
  .card{transition:none}
}

/* páginas de datos */
.doc{padding:30px 0 60px}
.doc h2{font-size:26px; text-transform:uppercase; margin:34px 0 12px}
.doc h3{font-size:17px; margin:22px 0 8px}
.doc p{color:var(--dim); max-width:68ch}
.panelbox{background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line-soft)}
th{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); font-weight:400}
td.num,th.num{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--raise)}
.scroll-x{overflow-x:auto}
.pill{
  display:inline-block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 8px; border-radius:100px;
  border:1px solid var(--line); color:var(--dim);
}
.pill.c{color:var(--cian); border-color:color-mix(in srgb,var(--cian) 50%,transparent)}
.pill.m{color:var(--registro); border-color:color-mix(in srgb,var(--registro) 50%,transparent)}
.pill.y{color:var(--amarillo); border-color:color-mix(in srgb,var(--amarillo) 50%,transparent)}

/* avisos */
.toasts{position:fixed; right:16px; bottom:16px; z-index:200; display:flex; flex-direction:column; gap:8px}
.toast{
  background:var(--sheet); border:1px solid var(--line); border-left:3px solid var(--registro);
  border-radius:var(--r-md); padding:11px 15px; font-size:13px; box-shadow:var(--shadow);
  max-width:340px; animation:in .22s ease;
}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)}
@keyframes in{from{opacity:0; transform:translateY(6px)}}

.foot{border-top:1px solid var(--line); padding:26px 0 40px; color:var(--mute); font-size:12.5px}
.foot a{color:var(--dim)}
.foot .cols{display:flex; gap:30px; flex-wrap:wrap; justify-content:space-between}

@media (max-width:900px){
  .bench{grid-template-columns:1fr; height:auto}
  .rail{border-right:0; border-bottom:1px solid var(--line); max-height:none; order:2}
  .stage{order:1; height:56vh}
  .rail-foot{position:static}
  .picker-menu{grid-template-columns:1fr}
}
@media print{
  .topbar,.foot,.ruler,.no-print{display:none}
  body{background:#fff; color:#000}
  .panelbox{border-color:#ccc}
}

</style>

<div class="ruler" aria-hidden="true"></div>

<script>
/* Primitivas de proceso de imagen. Todo corre en el navegador. */
(function (root) {
  'use strict';
  var IM = {};
  var INF = 1e20;

  IM.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

  IM.copy = function (id) {
    return new ImageData(new Uint8ClampedArray(id.data), id.width, id.height);
  };

  IM.blank = function (w, h) { return new ImageData(w, h); };

  IM.canvasOf = function (id) {
    var c = document.createElement('canvas');
    c.width = id.width; c.height = id.height;
    c.getContext('2d').putImageData(id, 0, 0);
    return c;
  };

  IM.dataOf = function (src, w, h) {
    w = w || src.naturalWidth || src.width;
    h = h || src.naturalHeight || src.height;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(src, 0, 0, w, h);
    return x.getImageData(0, 0, w, h);
  };

  /* Reescalado progresivo: al reducir, dividir a la mitad conserva el detalle. */
  IM.resize = function (src, w, h, smooth) {
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    var cur = src.width ? src : IM.canvasOf(src);
    if (src instanceof ImageData) cur = IM.canvasOf(src);
    if (smooth === false) {
      var o = document.createElement('canvas'); o.width = w; o.height = h;
      var oc = o.getContext('2d'); oc.imageSmoothingEnabled = false;
      oc.drawImage(cur, 0, 0, w, h);
      return o;
    }
    while (cur.width > w * 2 && cur.height > h * 2) {
      var half = document.createElement('canvas');
      half.width = Math.max(w, cur.width >> 1);
      half.height = Math.max(h, cur.height >> 1);
      var hc = half.getContext('2d');
      hc.imageSmoothingEnabled = true; hc.imageSmoothingQuality = 'high';
      hc.drawImage(cur, 0, 0, half.width, half.height);
      cur = half;
    }
    var out = document.createElement('canvas'); out.width = w; out.height = h;
    var ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(cur, 0, 0, w, h);
    return out;
  };

  /* --- Transformada de distancia exacta (Felzenszwalb & Huttenlocher) --- */
  function dt1d(f, d, v, z, idx, srcIdx, n) {
    var k = 0, q, s;
    v[0] = 0; z[0] = -INF; z[1] = INF;
    for (q = 1; q < n; q++) {
      s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);

  /* Trama de puntos: el motivo del oficio, dibujado en canvas. */
  function halftoneHero(cv, host) {
    var ctx = cv.getContext('2d'), raf = 0, t0 = performance.now();
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function size() {
      var r = host.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
      cv.width = r.width * d; cv.height = r.height * d;
      ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function draw(now) {
      var r = host.getBoundingClientRect(), w = r.width, h = r.height;
      var e = Math.max(0, Math.min(1, (now - t0) / 1100));
      var ease = 1 - Math.pow(1 - e, 3);
      ctx.clearRect(0, 0, w, h);
      var cell = 15, ang = -Math.PI / 8, cs = Math.cos(ang), sn = Math.sin(ang);
      var accent = getComputedStyle(document.documentElement).getPropertyValue('--registro').trim() || '#FF2D7E';
      var span = Math.ceil(Math.max(w, h) / cell) + 6;
      for (var i = -span; i < span; i++) for (var j = -span; j < span; j++) {
        var x = (i * cs - j * sn) * cell + w * 0.72;
        var y = (i * sn + j * cs) * cell + h * 0.45;
        if (x < -20 || x > w + 20 || y < -20 || y > h + 20) continue;
        var dx = (x - w * 0.78) / (w * 0.42), dy = (y - h * 0.5) / (h * 0.75);
        var d = Math.sqrt(dx * dx + dy * dy);
        var cover = Math.max(0, 1 - d);
        if (cover <= 0.01) continue;
        var rad = Math.max(0, cell * 0.52 * Math.sqrt(cover) * (reduce ? 1 : ease));
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, 6.2832);
        ctx.fillStyle = accent;
        ctx.globalAlpha = 0.10 + cover * 0.30;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!reduce && e < 1) raf = requestAnimationFrame(draw);
    }
    size(); draw(performance.now());
    addEventListener('resize', function () { size(); cancelAnimationFrame(raf); t0 = performance.now() - 1200; draw(performance.now()); });
  }

  /* ---------------- enrutado ---------------- */
  function route() {
    var app = document.getElementById('app');
    app.innerHTML = '';
    document.querySelector('.picker').classList.remove('open');
    var slug = (location.hash || '#/').replace(/^#\/?/, '').split('?')[0];

<script>
/* Eliminar fondos: varita por color más pinceles de borrar y restaurar. */
(function () {
  'use strict';

  function autoAlpha(src, seeds, p) {
    var w = src.width, h = src.height, n = w * h, i;
    var out = new Float32Array(n);
    var list = seeds.map(function (s) {
      return IM.clamp(Math.round(s[1] * (h - 1)), 0, h - 1) * w + IM.clamp(Math.round(s[0] * (w - 1)), 0, w - 1);
    });
    if (!list.length) { out.fill(1); return out; }
    var mask = IM.floodMask(src, list, p.tolerancia, p.contiguo);
    for (i = 0; i < n; i++) out[i] = mask[i] ? 0 : 1;
    return out;
  }

  function paintCursor(view) {
    var c = NV.el('div', {
      style: 'position:absolute;border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);border-radius:50%;pointer-events:none;display:none;z-index:6;mix-blend-mode:difference'
    });
    view.appendChild(c);
    return c;
  }

  NV.register({
    slug: 'eliminar-fondos',
    name: 'Eliminar fondos',
    group: 'Limpieza de recortes',
    tagline: 'Varita por color, pincel para borrar y pincel para devolver lo que se comió.',
    icon: NV.svg('<path d="M13 3 3 13l5 5 10-10z"/><path d="m14 8 5 5"/><path d="M18 20h4"/><path d="M8 18 5 21"/>'),
    intro: 'Haz clic sobre el fondo para quitarlo. Después corrige a mano con los pinceles. Ideal para fondos planos: blancos, chroma y estudio.',
    debounce: 60,
    controls: [
      { k: 'seg', id: 'herramienta', label: 'Herramienta', def: 'varita', opts: [['varita', 'Varita'], ['borrar', 'Borrar'], ['restaurar', 'Restaurar']] },
      { k: 'note', text: 'Clic en el fondo para marcarlo. Cada clic suma un color de referencia.', show: function (p) { return p.herramienta === 'varita'; } },
      { k: 'note', text: 'Pinta sobre la imagen. Mantén Alt para desplazar el lienzo.', show: function (p) { return p.herramienta !== 'varita'; } },
      { k: 'range', id: 'tolerancia', label: 'Tolerancia', min: 1, max: 120, step: 1, def: 26, unit: '' },
      { k: 'check', id: 'contiguo', label: 'Solo la zona conectada', def: true },
      { k: 'range', id: 'pincel', label: 'Tamaño del pincel', min: 4, max: 400, step: 2, def: 60, unit: ' px', show: function (p) { return p.herramienta !== 'varita'; } },
      { k: 'range', id: 'dureza', label: 'Dureza del pincel', min: 0, max: 100, step: 5, def: 80, unit: ' %', show: function (p) { return p.herramienta !== 'varita'; } },
      { k: 'group', label: 'Acabado del recorte' },
      { k: 'range', id: 'suave', label: 'Suavizar borde', min: 0, max: 4, step: 0.1, def: 0.8, unit: ' px', dec: 1, scale: true },
      { k: 'range', id: 'contraer', label: 'Contraer contorno', min: -3, max: 4, step: 0.25, def: 0.75, unit: ' px', dec: 2, scale: true },
      { k: 'range', id: 'desfleque', label: 'Desfleque (quita halo)', min: 0, max: 100, step: 1, def: 75, unit: ' %' },
      { k: 'check', id: 'ver', label: 'Ver el recorte sobre fondo de aviso', def: false }
    ],
    setup: function (api, stage, vw) {
      var st = api.state, p = api.params;
      st.custom = { seeds: [], cache: {} };
      ['full', 'prev'].forEach(function (key) {
        var s = st[key], c = document.createElement('canvas');
        c.width = s.width; c.height = s.height;
        st.custom[key + 'Mask'] = c;
      });
      /* Semillas iniciales: las cuatro esquinas suelen ser fondo. */
      st.custom.seeds = [[0.004, 0.004], [0.996, 0.004], [0.004, 0.996], [0.996, 0.996]];

      var cursor = paintCursor(vw.view), last = null, drawing = false;

      function toImage(e) {
        var r = vw.base.getBoundingClientRect();
        return {
          x: (e.clientX - r.left) / r.width,
          y: (e.clientY - r.top) / r.height,
          scale: r.width / vw.base.width
        };
      }
      function stroke(a, b) {
        var col = p.herramienta === 'borrar' ? 'rgba(255,0,0,' : 'rgba(0,255,0,';
        ['full', 'prev'].forEach(function (key) {
          var cv = st.custom[key + 'Mask'], ctx = cv.getContext('2d');
          var rad = p.pincel / 2 * (cv.width / st.full.width);
          var g = ctx.createRadialGradient(b.x * cv.width, b.y * cv.height, rad * (p.dureza / 100),
            b.x * cv.width, b.y * cv.height, Math.max(0.6, rad));
          g.addColorStop(0, col + '1)'); g.addColorStop(1, col + '0)');
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          if (a) {
            ctx.strokeStyle = col + '1)';
            ctx.lineWidth = rad * 2 * (0.35 + 0.65 * p.dureza / 100);
            ctx.beginPath();
            ctx.moveTo(a.x * cv.width, a.y * cv.height);
            ctx.lineTo(b.x * cv.width, b.y * cv.height);
            ctx.stroke();
          }
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(b.x * cv.width, b.y * cv.height, Math.max(0.6, rad), 0, 6.2832);
          ctx.fill();
        });
      }

      vw.view.addEventListener('pointerdown', function (e) {
        var m = toImage(e);
        if (m.x < 0 || m.x > 1 || m.y < 0 || m.y > 1) return;
        if (p.herramienta === 'varita') {
          if (e.shiftKey) st.custom.seeds = [];
          st.custom.seeds.push([m.x, m.y]);
          st.custom.cache = {};
          api.rerun();
          return;
        }
        if (e.altKey) return;
        drawing = true; last = m; stroke(null, m); api.rerun();
      });
      window.addEventListener('pointermove', function (e) {
        var m = toImage(e);
        if (p.herramienta !== 'varita') {
          var r = vw.base.getBoundingClientRect();
          var d = p.pincel * (r.width / vw.base.width) * (st.full.width / vw.base.width);
          var vr = vw.view.getBoundingClientRect();
          cursor.style.display = 'block';
          cursor.style.width = cursor.style.height = d + 'px';
          cursor.style.left = (e.clientX - vr.left - d / 2) + 'px';
          cursor.style.top = (e.clientY - vr.top - d / 2) + 'px';
        } else cursor.style.display = 'none';
        if (!drawing) return;
        stroke(last, m); last = m; api.rerun();
      });
      window.addEventListener('pointerup', function () { drawing = false; last = null; });
      vw.view.addEventListener('pointerleave', function () { cursor.style.display = 'none'; });
      function lock() {
        vw.view.dataset.lock = (p.herramienta !== 'varita' && !window.__nvAlt) ? '1' : '0';
      }
      window.addEventListener('keydown', function (e) { if (e.key === 'Alt') { window.__nvAlt = 1; lock(); } });
      window.addEventListener('keyup', function (e) { if (e.key === 'Alt') { window.__nvAlt = 0; lock(); } });
      setInterval(lock, 250);

      api.reset = function () {
        st.custom.seeds = []; st.custom.cache = {};
        ['full', 'prev'].forEach(function (key) {
          var c = st.custom[key + 'Mask'];
          c.getContext('2d').clearRect(0, 0, c.width, c.height);
        });
        api.rerun();
      };
      var railFoot = document.querySelector('.rail-foot');
      railFoot.insertBefore(NV.el('button', {
        class: 'btn ghost wide', text: 'Empezar de cero', onclick: function () { api.reset(); NV.toast('Recorte reiniciado.'); }
      }), railFoot.firstChild);
    },
    process: function (c) {
      var st = c.state, src = c.src, w = src.width, h = src.height, n = w * h, i;
      var key = (c.preview ? 'p' : 'f') + '|' + c.p.tolerancia + '|' + c.p.contiguo + '|' + st.custom.seeds.length;
      var alpha = st.custom.cache[key];
      if (!alpha) { alpha = autoAlpha(src, st.custom.seeds, c.p); st.custom.cache = {}; st.custom.cache[key] = alpha; }

      var mc = st.custom[(c.preview ? 'prev' : 'full') + 'Mask'];
      var md = mc.getContext('2d').getImageData(0, 0, mc.width, mc.height).data;
      var out = IM.copy(src), q = out.data, p0 = src.data;
      for (i = 0; i < n; i++) {
        var a = alpha[i];
        var er = md[i * 4] / 255, keep = md[i * 4 + 1] / 255;
        a = a * (1 - er);
        if (keep > 0) a = Math.max(a, keep);
        q[i * 4 + 3] = p0[i * 4 + 3] * a;
      }
      if (c.p.desfleque > 0) out = IM.defringe(out, c.p.desfleque / 100, 250);
      if (Math.abs(c.p.contraer) > 0.001 || c.p.suave > 0.05) out = IM.reshapeAlpha(out, c.p.contraer, c.p.suave, 128);
      if (c.p.ver) {
        var v = out.data;
        for (i = 0; i < n; i++) {
          var al = v[i * 4 + 3] / 255;
          v[i * 4] = v[i * 4] * al + 255 * (1 - al) * 0.18 + 40 * (1 - al);
          v[i * 4 + 1] = v[i * 4 + 1] * al + 12 * (1 - al);
          v[i * 4 + 2] = v[i * 4 + 2] * al + 70 * (1 - al);
          v[i * 4 + 3] = 255;
        }
      }
      return out;
    }
  });
})();

</script>
<script>
/* Reducir bordes: contrae el contorno y elimina el halo del recorte. */
(function () {
  'use strict';

  /* Etiquetado de componentes sobre una máscara binaria. */
  function components(mask, w, h) {
    var lab = new Int32Array(w * h).fill(-1), sizes = [], stack = [], i, n = w * h;
    for (i = 0; i < n; i++) {
      if (!mask[i] || lab[i] >= 0) continue;
      var id = sizes.length, count = 0;
      stack.push(i); lab[i] = id;
      while (stack.length) {
        var c = stack.pop(); count++;
        var x = c % w, y = (c / w) | 0;
        if (x > 0 && mask[c - 1] && lab[c - 1] < 0) { lab[c - 1] = id; stack.push(c - 1); }
        if (x < w - 1 && mask[c + 1] && lab[c + 1] < 0) { lab[c + 1] = id; stack.push(c + 1); }
        if (y > 0 && mask[c - w] && lab[c - w] < 0) { lab[c - w] = id; stack.push(c - w); }
        if (y < h - 1 && mask[c + w] && lab[c + w] < 0) { lab[c + w] = id; stack.push(c + w); }
      }
      sizes.push(count);
    }
    return { lab: lab, sizes: sizes };
  }

  function clean(id, motas, huecos, thr) {
    var w = id.width, h = id.height, n = w * h, p = id.data, i;
    var out = IM.copy(id), q = out.data;
    if (motas > 0) {
      var solid = new Uint8Array(n);
      for (i = 0; i < n; i++) solid[i] = p[i * 4 + 3] >= thr ? 1 : 0;
      var cs = components(solid, w, h);
      for (i = 0; i < n; i++) if (cs.lab[i] >= 0 && cs.sizes[cs.lab[i]] < motas) q[i * 4 + 3] = 0;
    }
    if (huecos > 0) {
      var empty = new Uint8Array(n);
      for (i = 0; i < n; i++) empty[i] = q[i * 4 + 3] < thr ? 1 : 0;
      var ch = components(empty, w, h);
      var borde = {};
      for (i = 0; i < w; i++) { if (ch.lab[i] >= 0) borde[ch.lab[i]] = 1; if (ch.lab[(h - 1) * w + i] >= 0) borde[ch.lab[(h - 1) * w + i]] = 1; }
      for (i = 0; i < h; i++) { if (ch.lab[i * w] >= 0) borde[ch.lab[i * w]] = 1; if (ch.lab[i * w + w - 1] >= 0) borde[ch.lab[i * w + w - 1]] = 1; }
      var bled = IM.bleed(out, thr).data;
      for (i = 0; i < n; i++) {
        var L = ch.lab[i];
        if (L >= 0 && !borde[L] && ch.sizes[L] < huecos) {
          q[i * 4] = bled[i * 4]; q[i * 4 + 1] = bled[i * 4 + 1]; q[i * 4 + 2] = bled[i * 4 + 2];
          q[i * 4 + 3] = 255;
        }
      }
    }
    return out;
  }

  NV.register({
    slug: 'reducir-bordes',
    name: 'Reducir bordes',
    group: 'Limpieza de recortes',
    tagline: 'Contrae el contorno, borra el halo y limpia las motas del recorte.',
    icon: NV.svg('<path d="M4 4h16v16H4z" stroke-dasharray="3 3"/><path d="M8 8h8v8H8z"/><path d="m9.5 12 2 2 3.5-4"/>'),
    intro: 'Un recorte deja un filo de píxeles del fondo viejo. Contrae 1 o 2 píxeles y aplica desfleque: el halo desaparece sin comerse el diseño.',
    controls: [
      { k: 'range', id: 'radio', label: 'Contraer contorno', min: -6, max: 6, step: 0.25, def: 1, unit: ' px', dec: 2, scale: true },
      { k: 'note', text: 'Valores negativos expanden el diseño en lugar de recortarlo.' },
      { k: 'range', id: 'suave', label: 'Suavizado del filo', min: 0, max: 4, step: 0.1, def: 1, unit: ' px', dec: 1, scale: true },
      { k: 'range', id: 'desfleque', label: 'Desfleque (quita halo)', min: 0, max: 100, step: 1, def: 70, unit: ' %' },
      { k: 'group', label: 'Limpieza' },
      { k: 'range', id: 'motas', label: 'Borrar motas menores a', min: 0, max: 400, step: 5, def: 0, unit: ' px²', scale: 2 },
      { k: 'range', id: 'huecos', label: 'Rellenar huecos menores a', min: 0, max: 400, step: 5, def: 0, unit: ' px²', scale: 2 },
      { k: 'group', label: 'Ajuste fino' },
      { k: 'range', id: 'umbral', label: 'Umbral de borde', min: 8, max: 240, step: 2, def: 128, unit: '' },
      { k: 'note', text: 'Sube el umbral si el contorno trae mucha transparencia parcial.' }
    ],
    process: function (c) {
      var out = c.src;
      if (c.p.motas > 0 || c.p.huecos > 0) out = clean(out, c.p.motas, c.p.huecos, c.p.umbral);
      if (c.p.desfleque > 0) out = IM.defringe(out, c.p.desfleque / 100, 250);
      if (c.p.radio < 0) out = IM.bleed(out, c.p.umbral);
      if (Math.abs(c.p.radio) > 0.001 || c.p.suave > 0.05) out = IM.reshapeAlpha(out, c.p.radio, c.p.suave, c.p.umbral);

<script>
/* Vectorizador: cuantiza el color, traza contornos reales y separa por capas. */
(function () {
  'use strict';
  var WORK = 1400;

  function area(pts) {
    var a = 0, n = pts.length, i;
    for (i = 0; i < n; i++) {
      var j = (i + 1) % n;
      a += pts[i][0] * pts[j][1] - pts[j][0] * pts[i][1];
    }
    return Math.abs(a) / 2;
  }

  function vectorize(src, p) {
    var work = src;
    if (Math.max(src.width, src.height) > WORK) {
      var k = WORK / Math.max(src.width, src.height);
      work = IM.dataOf(IM.resize(src, src.width * k, src.height * k),
        Math.round(src.width * k), Math.round(src.height * k));
    }
    var w = work.width, h = work.height, n = w * h, i;
    var pal, map;

    if (p.modo === 'silueta') {
      pal = [IM.rgb(p.tinta)];
      map = new Int32Array(n);
      var d = work.data;
      for (i = 0; i < n; i++) {
        var lum = (0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2]);
        var on = d[i * 4 + 3] > 128 && (p.invertir ? lum > p.umbral : lum < p.umbral);
        map[i] = on ? 0 : -1;
      }
    } else {
      var q = IM.quantize(work, p.colores, 10);
      pal = q.palette; map = q.map;
      if (p.sinFondo) {                                  // el fondo claro no es una tinta
        var fuera = {};
        pal.forEach(function (col, k) {
          if (IM.colorDistance(col[0], col[1], col[2], 255, 255, 255) < 22) fuera[k] = 1;
        });
        for (i = 0; i < n; i++) if (fuera[map[i]]) map[i] = -1;
      }
    }

    var layers = [];
    pal.forEach(function (col, idx) {
      var mask = new Uint8Array(n), count = 0;
      for (i = 0; i < n; i++) if (map[i] === idx) { mask[i] = 1; count++; }
      if (!count) return;
      var loops = IM.traceMask(mask, w, h), paths = [];
      loops.forEach(function (loop) {
        var pts = IM.dropCollinear(loop);
        if (area(pts) < p.minima) return;
        pts = IM.rdp(pts, p.detalle);
        if (pts.length < 3) return;
        paths.push(IM.pathData(pts, p.suavizado, 2));
      });
      if (paths.length) layers.push({ color: IM.hex(col), d: paths.join(' '), px: count });
    });
    layers.sort(function (a, b) { return b.px - a.px; });
    return { layers: layers, w: w, h: h };
  }

  function raster(v, W, H) {
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d');
    ctx.scale(W / v.w, H / v.h);
    v.layers.forEach(function (L) {
      ctx.fillStyle = L.color;
      ctx.fill(new Path2D(L.d), 'evenodd');
    });
    return ctx.getImageData(0, 0, W, H);
  }

  function svgText(v, W, H, layers) {
    var s = '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="' + W +
      '" height="' + H + '" viewBox="0 0 ' + v.w + ' ' + v.h + '" shape-rendering="geometricPrecision">\n';
    (layers || v.layers).forEach(function (L, i) {
      s += '  <g id="tinta-' + (i + 1) + '" data-color="' + L.color + '">' +
        '<path fill="' + L.color + '" fill-rule="evenodd" d="' + L.d + '"/></g>\n';
    });
    return s + '</svg>\n';
  }

  NV.register({
    slug: 'vectorizador',
    name: 'Vectorizar y separar colores',
    group: 'Preparación del arte',
    tagline: 'De píxeles a curvas SVG, con una capa por tinta lista para separar.',
    icon: NV.svg('<path d="M5 19c4-1 5-9 9-11 2-1 4 0 5 2"/><rect x="2" y="17" width="4" height="4"/><rect x="18" y="5" width="4" height="4"/>'),
    intro: 'Traza el contorno exacto de cada color y lo entrega como SVG editable. La separación por capas te sirve para serigrafía, vinil de corte o para recolorear sin perder filo.',
    manual: true,
    previewMax: 1400,
    controls: [
      { k: 'seg', id: 'modo', label: 'Modo', def: 'color', heavy: true, opts: [['color', 'Por colores'], ['silueta', 'Silueta a una tinta']] },
      { k: 'range', id: 'colores', label: 'Número de tintas', min: 2, max: 24, step: 1, def: 8, unit: '', heavy: true, show: function (p) { return p.modo === 'color'; } },
      { k: 'range', id: 'umbral', label: 'Umbral de la silueta', min: 10, max: 245, step: 5, def: 128, unit: '', heavy: true, show: function (p) { return p.modo === 'silueta'; } },
      { k: 'check', id: 'invertir', label: 'Invertir la silueta', def: false, heavy: true, show: function (p) { return p.modo === 'silueta'; } },
      { k: 'color', id: 'tinta', label: 'Color de la tinta', def: '#111111', heavy: true, show: function (p) { return p.modo === 'silueta'; } },
      { k: 'check', id: 'sinFondo', label: 'Descartar el fondo blanco', def: true, heavy: true, show: function (p) { return p.modo === 'color'; } },
      { k: 'group', label: 'Trazo' },
      { k: 'range', id: 'detalle', label: 'Simplificar curvas', min: 0, max: 6, step: 0.1, def: 1, unit: ' px', dec: 1, heavy: true },
      { k: 'range', id: 'suavizado', label: 'Suavizado', min: 0, max: 1, step: 0.05, def: 0.5, unit: '', dec: 2, heavy: true },
      { k: 'range', id: 'minima', label: 'Descartar manchas menores a', min: 0, max: 400, step: 5, def: 24, unit: ' px²', heavy: true },
      { k: 'note', text: 'Pulsa Procesar después de mover los controles: el trazado es la parte pesada.' }
    ],
    process: function (c) {
      var v = vectorize(c.src, c.p);
      c.state.custom.vec = v;
      return raster(v, c.src.width, c.src.height);
    },
    exports: [
      {
        label: 'Descargar SVG', ext: 'svg',
        make: function (api, done) {
          var v = api.state.custom.vec || vectorize(api.src, api.params);
          var txt = svgText(v, api.src.width, api.src.height);
          NV.download(new Blob([txt], { type: 'image/svg+xml' }), api.name + '-vector.svg');
          done();
        }
      },
      {
        label: 'Descargar PNG', ext: 'png', secondary: true,
        make: function (api, done) {
          var v = api.state.custom.vec || vectorize(api.src, api.params);
          var id = raster(v, api.src.width, api.src.height);
          NV.blobOf(IM.canvasOf(id)).then(function (b) { NV.download(b, api.name + '-vector.png'); done(); });
        }
      },
      {
        label: 'Separación por tintas (ZIP)', ext: 'zip', secondary: true,
        make: function (api, done) {
          var v = api.state.custom.vec || vectorize(api.src, api.params);
          var W = api.src.width, H = api.src.height, files = [], jobs = [];
          v.layers.forEach(function (L, i) {
            var nom = 'tinta-' + ('0' + (i + 1)).slice(-2) + '-' + L.color.replace('#', '');
            files.push({ name: nom + '.svg', blob: new Blob([svgText(v, W, H, [L])], { type: 'image/svg+xml' }) });
            var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
            var ctx = cv.getContext('2d');
            ctx.scale(W / v.w, H / v.h);
            ctx.fillStyle = L.color;
            ctx.fill(new Path2D(L.d), 'evenodd');
            jobs.push(NV.blobOf(cv).then(function (b) { files.push({ name: nom + '.png', blob: b }); }));
          });
          files.push({ name: 'completo.svg', blob: new Blob([svgText(v, W, H)], { type: 'image/svg+xml' }) });
          Promise.all(jobs).then(function () {
            return NV.zip(files);
          }).then(function (z) {
            NV.download(z, api.name + '-separacion.zip');
            NV.toast(v.layers.length + ' tintas separadas.', 'ok');
            done();
          });
        }
      }
    ]
  });
})();

</script>
<script>
/* Redimensionar: tamaño físico real, con DPI grabado en el PNG. */
(function () {
  'use strict';
  var CM = 2.54;

  function targetPx(p, src) {
    var d = Math.max(10, p.dpi || 300);
    if (p.unidad === 'px') return { w: Math.round(p.ancho), h: Math.round(p.alto) };
    if (p.unidad === 'cm') return { w: Math.round(p.ancho / CM * d), h: Math.round(p.alto / CM * d) };
    return { w: Math.round(p.ancho * d), h: Math.round(p.alto * d) };
  }

  NV.register({
    slug: 'redimensionar',
    name: 'Redimensionar',
    group: 'Preparación del arte',
    tagline: 'Ajusta a centímetros reales, fija los DPI y encuadra sin deformar.',
    icon: NV.svg('<path d="M3 3h11v11H3z"/><path d="M10 10h11v11H10z"/>'),
    intro: 'Escribe el tamaño en centímetros y los DPI: el PNG sale con la resolución física grabada, así el RIP lo coloca al tamaño correcto.',
    debounce: 200,
    controls: [
      { k: 'seg', id: 'unidad', label: 'Unidad', def: 'cm', opts: [['cm', 'Centímetros'], ['in', 'Pulgadas'], ['px', 'Píxeles']] },
      { k: 'num', id: 'ancho', label: 'Ancho', def: 20, min: 0.1, step: 0.1 },
      { k: 'num', id: 'alto', label: 'Alto', def: 20, min: 0.1, step: 0.1 },
      { k: 'check', id: 'proporcion', label: 'Mantener proporción', def: true },
      { k: 'num', id: 'dpi', label: 'Resolución', unit: 'DPI', def: 300, min: 30, max: 1200, step: 10 },
      { k: 'note', text: 'Para DTF y serigrafía, 300 DPI al tamaño final es el estándar. Por debajo de 150 se nota el pixelado.' },
      { k: 'group', label: 'Encuadre' },
      { k: 'seg', id: 'modo', label: 'Cómo encajar', def: 'ajustar', opts: [['ajustar', 'Ajustar'], ['rellenar', 'Rellenar'], ['estirar', 'Estirar']] },
      { k: 'check', id: 'fondo', label: 'Fondo de color en vez de transparente', def: false },
      { k: 'color', id: 'color', label: 'Color de fondo', def: '#ffffff', show: function (p) { return p.fondo; } }
    ],
    onControl: function (c, p, state) {
      if (!state.full) return;
      var ar = state.full.width / state.full.height;
      if (c.id === 'unidad') {
        var d = p.dpi;
        var wpx = state.full.width, hpx = state.full.height;
        if (p.unidad === 'px') { p.ancho = wpx; p.alto = hpx; }
        else if (p.unidad === 'cm') { p.ancho = +(wpx / d * CM).toFixed(1); p.alto = +(hpx / d * CM).toFixed(1); }
        else { p.ancho = +(wpx / d).toFixed(2); p.alto = +(hpx / d).toFixed(2); }
        return;
      }
      if (!p.proporcion) return;
      if (c.id === 'ancho') p.alto = +(p.ancho / ar).toFixed(p.unidad === 'px' ? 0 : 2);
      else if (c.id === 'alto') p.ancho = +(p.alto * ar).toFixed(p.unidad === 'px' ? 0 : 2);
      else if (c.id === 'proporcion') p.alto = +(p.ancho / ar).toFixed(p.unidad === 'px' ? 0 : 2);
    },
    process: function (c) {
      var t = targetPx(c.p, c.src);
      var W = IM.clamp(t.w, 1, 20000), H = IM.clamp(t.h, 1, 20000);
      if (c.preview) {
        var lim = 1500, m = Math.max(W, H);
        if (m > lim) { W = Math.max(1, Math.round(W * lim / m)); H = Math.max(1, Math.round(H * lim / m)); }
      }
      var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      var ctx = cv.getContext('2d');
      if (c.p.fondo) { ctx.fillStyle = c.p.color; ctx.fillRect(0, 0, W, H); }
      var sw = c.src.width, sh = c.src.height, dw = W, dh = H, dx = 0, dy = 0;
      if (c.p.modo !== 'estirar') {
        var k = c.p.modo === 'rellenar' ? Math.max(W / sw, H / sh) : Math.min(W / sw, H / sh);
        dw = sw * k; dh = sh * k; dx = (W - dw) / 2; dy = (H - dh) / 2;
      }
      var pre = IM.resize(c.src, Math.max(1, Math.round(dw)), Math.max(1, Math.round(dh)));
      ctx.drawImage(pre, dx, dy);
      return ctx.getImageData(0, 0, W, H);
    }
  });
})();

<script>

    if (lim && Math.max(w, h) > lim) {
      var k = lim / Math.max(w, h);
      w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    }
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');

    slug: 'conversor',

    intro: 'PNG conserva la transparencia; JPG pesa menos pero aplana el fondo; WEBP da el mejor peso para catálogos y redes.',
    debounce: 150,
    controls: [
      { k: 'seg', id: 'formato', label: 'Formato de salida', def: 'png', opts: [['png', 'PNG'], ['jpeg', 'JPG'], ['webp', 'WEBP']] },
      { k: 'note', text: 'JPG no admite transparencia: el fondo se aplana con el color elegido.', show: function (p) { return p.formato === 'jpeg'; } },
      { k: 'range', id: 'calidad', label: 'Calidad', min: 30, max: 100, step: 1, def: 92, unit: ' %', show: function (p) { return p.formato !== 'png'; } },
      { k: 'check', id: 'plano', label: 'Aplanar el fondo aunque el formato admita alfa', def: false, show: function (p) { return p.formato !== 'jpeg'; } },
      { k: 'color', id: 'color', label: 'Color de fondo', def: '#ffffff', show: function (p) { return p.formato === 'jpeg' || p.plano; } },
      { k: 'group', label: 'Tamaño' },
      { k: 'check', id: 'limite', label: 'Limitar el lado más largo', def: false },
      { k: 'num', id: 'maxlado', label: 'Lado máximo', unit: 'px', def: 2000, min: 64, max: 12000, step: 50, show: function (p) { return p.limite; } },
      { k: 'num', id: 'dpi', label: 'DPI a grabar en el PNG', unit: 'DPI', def: 300, min: 30, max: 1200, step: 10, show: function (p) { return p.formato === 'png'; } }
    ],

          return p.formato === 'png' ? NV.pngWithDpi(b, p.dpi) : b;
        }).then(function (b) {
          NV.toast('Peso final: ' + (b.size / 1024 > 1024 ? (b.size / 1048576).toFixed(2) + ' MB' : Math.round(b.size / 1024) + ' KB'), 'ok');
          NV.download(b, api.name + '.' + (p.formato === 'jpeg' ? 'jpg' : p.formato));
          done();
        });
      }
    }]
  });
})();

<script>
/* Semitonos: trama de puntos y desvanecidos para DTF y serigrafía. */
(function () {
  'use strict';

  var ANG = { c: 15, m: 75, y: 0, k: 45 };

  function shapePath(ctx, x, y, r, shape) {
    if (shape === 'circulo') { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832); return; }
    if (shape === 'cuadro') { ctx.rect(x - r * 0.886, y - r * 0.886, r * 1.772, r * 1.772); return; }
    if (shape === 'rombo') {
      var d = r * 1.25;
      ctx.moveTo(x, y - d); ctx.lineTo(x + d, y); ctx.lineTo(x, y + d); ctx.lineTo(x - d, y); ctx.closePath();
      return;
    }
    if (shape === 'cruz') {
      var a = r * 1.3, b = r * 0.42;
      ctx.rect(x - a, y - b, a * 2, b * 2); ctx.rect(x - b, y - a, b * 2, a * 2);
      return;
    }
    ctx.rect(x - r * 1.6, y - r * 0.9, r * 3.2, r * 1.8);   // línea
  }

  /* Cobertura media de una celda: luminancia y alfa del original. */
  function sampler(id) {
    var w = id.width, h = id.height, p = id.data;
    return function (cx, cy, half) {
      var x0 = Math.max(0, Math.floor(cx - half)), x1 = Math.min(w - 1, Math.ceil(cx + half));
      var y0 = Math.max(0, Math.floor(cy - half)), y1 = Math.min(h - 1, Math.ceil(cy + half));
      if (x1 < x0 || y1 < y0) return null;
      var lum = 0, al = 0, r = 0, g = 0, b = 0, n = 0, x, y, i;
      var step = Math.max(1, Math.floor((x1 - x0) / 6));
      for (y = y0; y <= y1; y += step) for (x = x0; x <= x1; x += step) {
        i = (y * w + x) * 4;
        var a = p[i + 3] / 255;
        lum += (0.2126 * p[i] + 0.7152 * p[i + 1] + 0.0722 * p[i + 2]) / 255 * a;
        r += p[i] * a; g += p[i + 1] * a; b += p[i + 2] * a;
        al += a; n++;
      }
      if (!n) return null;
      return { lum: lum / n, a: al / n, r: al ? r / al : 0, g: al ? g / al : 0, b: al ? b / al : 0 };
    };
  }

  function ramp(p, x, y, w, h) {
    var t;
    if (p.dir === 'abajo') t = y / h;
    else if (p.dir === 'arriba') t = 1 - y / h;
    else if (p.dir === 'derecha') t = x / w;
    else if (p.dir === 'izquierda') t = 1 - x / w;
    else {
      var dx = (x - w / 2) / (w / 2), dy = (y - h / 2) / (h / 2);
      t = Math.min(1, Math.sqrt(dx * dx + dy * dy));
    }
    var ini = p.inicio / 100, fin = p.fin / 100;
    if (fin <= ini) fin = ini + 0.001;
    return IM.clamp((t - ini) / (fin - ini), 0, 1);
  }

  function pass(ctx, src, p, cellPx, angleDeg, color, chan) {
    var w = src.width, h = src.height;
    var smp = sampler(src);
    var a = angleDeg * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
    var diag = Math.ceil(Math.sqrt(w * w + h * h) / cellPx) + 2;
    ctx.fillStyle = color || '#000';
    ctx.beginPath();
    for (var i = -diag; i <= diag; i++) for (var j = -diag; j <= diag; j++) {
      var x = (i * cs - j * sn) * cellPx + w / 2;
      var y = (i * sn + j * cs) * cellPx + h / 2;
      if (x < -cellPx || y < -cellPx || x > w + cellPx || y > h + cellPx) continue;
      var s = smp(x, y, cellPx / 2);
      if (!s || s.a < 0.02) continue;
      var cover = 1;
      if (p.modo === 'tono' || p.modo === 'ambos') {
        cover = chan ? chan(s) : (1 - s.lum / Math.max(0.001, s.a));
        cover = IM.clamp(cover, 0, 1) * s.a;
      } else cover = s.a;
      if (p.modo === 'fade' || p.modo === 'ambos') cover *= (1 - ramp(p, x, y, w, h));
      if (cover <= 0.004) continue;
      var r = 0.708 * cellPx * Math.sqrt(cover) * (p.grosor / 100);
      if (p.color === 'original') {
        ctx.fill(); ctx.beginPath();
        ctx.fillStyle = 'rgb(' + (s.r | 0) + ',' + (s.g | 0) + ',' + (s.b | 0) + ')';
        shapePath(ctx, x, y, r, p.forma);
        ctx.fill(); ctx.beginPath();
        continue;
      }
      shapePath(ctx, x, y, r, p.forma);
    }
    ctx.fill();
  }

  NV.register({
    slug: 'semitonos',
    name: 'Semitonos y desvanecidos',
    group: 'Efectos de impresión',
    tagline: 'Trama de puntos con ángulo y forma, y degradados que se disuelven en puntos.',
    icon: NV.svg('<circle cx="6" cy="6" r="3"/><circle cx="17" cy="6" r="2.2"/><circle cx="6" cy="17" r="2.2"/><circle cx="17" cy="17" r="1.2"/>'),
    intro: 'El desvanecido en puntos es la forma correcta de degradar en DTF: la impresora no imprime alfa parcial, pero sí puntos sólidos cada vez más chicos.',
    debounce: 160,
    controls: [
      { k: 'seg', id: 'modo', label: 'Qué hacer', def: 'fade', opts: [['fade', 'Desvanecer'], ['tono', 'Tramar tonos'], ['ambos', 'Ambos']] },
      { k: 'range', id: 'celda', label: 'Tamaño de punto', min: 2, max: 40, step: 0.5, def: 8, unit: ' px', dec: 1, scale: true },
      { k: 'range', id: 'grosor', label: 'Grosor del punto', min: 40, max: 160, step: 1, def: 100, unit: ' %' },
      { k: 'select', id: 'forma', label: 'Forma', def: 'circulo', opts: [['circulo', 'Círculo'], ['cuadro', 'Cuadrado'], ['rombo', 'Rombo'], ['cruz', 'Cruz'], ['linea', 'Línea']] },
      { k: 'range', id: 'angulo', label: 'Ángulo de trama', min: 0, max: 90, step: 1, def: 45, unit: '°' },
      { k: 'group', label: 'Desvanecido', show: function (p) { return p.modo !== 'tono'; } },
      { k: 'select', id: 'dir', label: 'Dirección', def: 'abajo', show: function (p) { return p.modo !== 'tono'; }, opts: [['abajo', 'Hacia abajo'], ['arriba', 'Hacia arriba'], ['derecha', 'Hacia la derecha'], ['izquierda', 'Hacia la izquierda'], ['centro', 'Desde el centro']] },
      { k: 'range', id: 'inicio', label: 'Empieza a desvanecer', min: 0, max: 100, step: 1, def: 35, unit: ' %', show: function (p) { return p.modo !== 'tono'; } },
      { k: 'range', id: 'fin', label: 'Desaparece por completo', min: 0, max: 100, step: 1, def: 95, unit: ' %', show: function (p) { return p.modo !== 'tono'; } },
      { k: 'group', label: 'Color' },
      { k: 'seg', id: 'color', label: 'Tinta del punto', def: 'original', opts: [['original', 'Original'], ['solido', 'Un color'], ['cmyk', 'CMYK']] },
      { k: 'color', id: 'tinta', label: 'Color de tinta', def: '#111111', show: function (p) { return p.color === 'solido'; } },
      { k: 'note', text: 'CMYK separa en cuatro tramas con los ángulos clásicos (C 15°, M 75°, Y 0°, K 45°) para evitar muaré.', show: function (p) { return p.color === 'cmyk'; } }
    ],
    process: function (c) {
      var src = c.src, w = src.width, h = src.height, p = c.p;
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      var cell = Math.max(1.2, p.celda);
      if (p.color === 'cmyk') {
        ctx.globalCompositeOperation = 'source-over';
        var chans = [
          ['c', '#00AEEF', function (s) { return IM.clamp(1 - s.r / 255, 0, 1); }],
          ['m', '#EC008C', function (s) { return IM.clamp(1 - s.g / 255, 0, 1); }],
          ['y', '#FFF200', function (s) { return IM.clamp(1 - s.b / 255, 0, 1); }],
          ['k', '#231F20', function (s) { return IM.clamp(1 - Math.max(s.r, s.g, s.b) / 255, 0, 1); }]
        ];
        ctx.globalAlpha = 0.9;
        chans.forEach(function (ch) {
          var pp = Object.assign({}, p, { modo: p.modo === 'fade' ? 'ambos' : p.modo });
          pass(ctx, src, pp, cell, ANG[ch[0]], ch[1], ch[2]);
        });
        ctx.globalAlpha = 1;
      } else {
        pass(ctx, src, p, cell, p.angulo, p.color === 'solido' ? p.tinta : '#000');
      }
      return ctx.getImageData(0, 0, w, h);
    }
  });
})();

</script>
<script>
/* Marcos y grunge: desgaste, textura y encuadres de estilo taller. */
(function () {
  'use strict';

  function distress(id, p) {
    var w = id.width, h = id.height, n = w * h, i;
    var out = IM.copy(id), q = out.data;
    var nz = IM.noise(w, h, Math.max(2, p.escala), 4, p.semilla | 0);
    var edge = null;
    if (p.soloBordes) {
      var sdf = IM.alphaSDF(id, 128);
      edge = sdf;
    }
    var thr = 1 - p.intensidad / 100;
    for (i = 0; i < n; i++) {
      var v = nz[i];
      var cut = IM.clamp((v - thr) / 0.12 + 0.5, 0, 1);
      if (edge) {
        var d = edge[i];
        var near = IM.clamp(1 - (d - 1) / Math.max(1, p.anchoBorde), 0, 1);
        cut = 1 - (1 - cut) * near;
      }
      q[i * 4 + 3] = q[i * 4 + 3] * cut;
    }
    return out;
  }

  function texture(id, p) {
    var w = id.width, h = id.height, n = w * h, i, k;
    var out = IM.copy(id), q = out.data;
    var nz = IM.noise(w, h, Math.max(2, p.escala), 5, (p.semilla | 0) + 7);
    var amt = p.intensidad / 100;
    for (i = 0; i < n; i++) {
      var m = 1 - (1 - nz[i]) * amt;
      for (k = 0; k < 3; k++) q[i * 4 + k] = IM.clamp(q[i * 4 + k] * m, 0, 255);
    }
    return out;
  }

  function frame(id, p) {
    var w = id.width, h = id.height;
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.putImageData(id, 0, 0);
    var m = Math.min(w, h) * p.margen / 100;
    var g = Math.max(1, Math.min(w, h) * p.grosor / 100);
    ctx.strokeStyle = p.color; ctx.lineWidth = g;
    ctx.beginPath();
    if (p.marco === 'circulo') {
      ctx.arc(w / 2, h / 2, Math.min(w, h) / 2 - m - g / 2, 0, 6.2832);
    } else if (p.marco === 'redondo' || p.marco === 'sello') {
      var r = Math.min(w, h) * 0.06;
      var x = m + g / 2, y = m + g / 2, ww = w - 2 * x, hh = h - 2 * y;
      if (ctx.roundRect) ctx.roundRect(x, y, ww, hh, r);
      else ctx.rect(x, y, ww, hh);
    } else {
      ctx.rect(m + g / 2, m + g / 2, w - 2 * m - g, h - 2 * m - g);
    }
    ctx.stroke();
    if (p.marco === 'sello') {
      var m2 = m + g * 2.2;
      ctx.lineWidth = Math.max(1, g * 0.4);
      ctx.beginPath();
      ctx.rect(m2, m2, w - 2 * m2, h - 2 * m2);
      ctx.stroke();
    }
    return ctx.getImageData(0, 0, w, h);
  }

  NV.register({
    slug: 'marcos-grunge',
    name: 'Marcos y grunge',
    group: 'Efectos de impresión',
    tagline: 'Desgasta el diseño, añade textura sucia y enmarca con estilo de taller.',
    icon: NV.svg('<path d="M3 3h18v18H3z"/><path d="M7 8.5c1.5.6 2.5-.6 4 0s2.5 1 4 .3M7 13c2 .8 3-.7 4.5 0s2.6.9 4.5 0M8 17c1.5.5 2.4-.5 4 0"/>'),
    intro: 'El desgaste rompe el alfa con ruido fractal, igual que una plancha vieja. La textura ensucia el color sin tocar el recorte.',
    debounce: 220,
    controls: [
      { k: 'seg', id: 'efecto', label: 'Efecto', def: 'desgaste', opts: [['desgaste', 'Desgaste'], ['textura', 'Textura'], ['ninguno', 'Solo marco']] },
      { k: 'range', id: 'intensidad', label: 'Intensidad', min: 0, max: 95, step: 1, def: 40, unit: ' %', show: function (p) { return p.efecto !== 'ninguno'; } },
      { k: 'range', id: 'escala', label: 'Grano', min: 2, max: 120, step: 1, def: 18, unit: ' px', scale: true, show: function (p) { return p.efecto !== 'ninguno'; } },
      { k: 'range', id: 'semilla', label: 'Variante', min: 1, max: 60, step: 1, def: 7, unit: '', show: function (p) { return p.efecto !== 'ninguno'; } },
      { k: 'check', id: 'soloBordes', label: 'Desgastar solo el contorno', def: false, show: function (p) { return p.efecto === 'desgaste'; } },
      { k: 'range', id: 'anchoBorde', label: 'Ancho del desgaste', min: 2, max: 80, step: 1, def: 16, unit: ' px', scale: true, show: function (p) { return p.efecto === 'desgaste' && p.soloBordes; } },
      { k: 'group', label: 'Marco' },
      { k: 'select', id: 'marco', label: 'Tipo', def: 'ninguno', opts: [['ninguno', 'Sin marco'], ['recto', 'Recto'], ['redondo', 'Redondeado'], ['circulo', 'Círculo'], ['sello', 'Doble línea (sello)']] },
      { k: 'range', id: 'grosor', label: 'Grosor', min: 0.2, max: 8, step: 0.1, def: 1.5, unit: ' %', dec: 1, show: function (p) { return p.marco !== 'ninguno'; } },
      { k: 'range', id: 'margen', label: 'Margen', min: 0, max: 25, step: 0.5, def: 4, unit: ' %', dec: 1, show: function (p) { return p.marco !== 'ninguno'; } },
      { k: 'color', id: 'color', label: 'Color del marco', def: '#111111', show: function (p) { return p.marco !== 'ninguno'; } },
      { k: 'check', id: 'marcoSucio', label: 'Aplicar el desgaste también al marco', def: true, show: function (p) { return p.marco !== 'ninguno' && p.efecto === 'desgaste'; } }
    ],
    process: function (c) {
      var p = c.p, out = IM.copy(c.src);
      var conMarco = p.marco !== 'ninguno';
      if (conMarco && p.marcoSucio && p.efecto === 'desgaste') out = frame(out, p);
      if (p.efecto === 'desgaste') out = distress(out, p);
      else if (p.efecto === 'textura') out = texture(out, p);
      if (conMarco && !(p.marcoSucio && p.efecto === 'desgaste')) out = frame(out, p);
      return out;
    }
  });
})();

</script>

<script>
/* Hojas de impresión (gang sheet): acomoda los diseños y aprovecha el film. */
(function () {
  'use strict';
  var el = NV.el, CM = 2.54;

  function pack(items, sheetW, gap, margin) {
    var usable = sheetW - margin * 2, units = [], out = [];
    items.forEach(function (it) {
      var wcm = it.cm, hcm = it.cm * it.img.height / it.img.width;
      for (var i = 0; i < it.qty; i++) units.push({ it: it, w: wcm, h: hcm });
    });
    units.sort(function (a, b) { return b.h - a.h; });
    var x = margin, y = margin, shelf = 0;
    units.forEach(function (u) {
      var w = u.w, h = u.h, rot = false;
      if (u.it.rot && w > usable && h <= usable) { var t = w; w = h; h = t; rot = true; }
      if (w > usable) { var k = usable / w; w *= k; h *= k; }
      if (x + w > margin + usable + 1e-6) { y += shelf + gap; x = margin; shelf = 0; }
      out.push({ it: u.it, x: x, y: y, w: w, h: h, rot: rot });
      x += w + gap;
      shelf = Math.max(shelf, h);
    });
    return { places: out, length: out.length ? y + shelf + margin : margin * 2 };
  }

  function draw(cv, st, packed, forExport) {
    var pxcm = forExport ? st.dpi / CM : cv.width / st.ancho;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = forExport && !st.fondo ? 'rgba(0,0,0,0)' : (forExport ? st.color : '#ffffff');
    if (forExport && !st.fondo) ctx.clearRect(0, 0, cv.width, cv.height);
    else ctx.fillRect(0, 0, cv.width, cv.height);
    packed.places.forEach(function (p) {
      ctx.save();
      if (p.rot) {
        ctx.translate(p.x * pxcm + p.w * pxcm, p.y * pxcm);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(p.it.img, 0, 0, p.h * pxcm, p.w * pxcm);
      } else {
        ctx.drawImage(p.it.img, p.x * pxcm, p.y * pxcm, p.w * pxcm, p.h * pxcm);
      }
      ctx.restore();
      if (!forExport) {
        ctx.strokeStyle = 'rgba(255,45,126,.45)';
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x * pxcm, p.y * pxcm, p.w * pxcm, p.h * pxcm);
      }
    });
    if (!forExport) {
      ctx.strokeStyle = 'rgba(120,120,120,.5)';
      ctx.setLineDash([6, 5]);
      ctx.strokeRect(st.margen * pxcm, st.margen * pxcm,
        (st.ancho - st.margen * 2) * pxcm, cv.height - st.margen * 2 * pxcm);
      ctx.setLineDash([]);
    }
  }

  NV.register({
    slug: 'plantillas',
    name: 'Hojas de impresión',
    group: 'Producción',
    tagline: 'Acomoda varios diseños en el rollo, mide el metraje y exporta a los DPI reales.',
    icon: NV.svg('<path d="M3 4h18v16H3z"/><path d="M3 10h9v10M12 4v6h9"/>'),
    kind: 'custom',
    render: function (host) {
      var t = this;
      var parts = NV.bench(host, t);
      var st = { ancho: 58, dpi: 300, gap: 0.5, margen: 0.5, fondo: false, color: '#ffffff' };
      var items = [], packed = { places: [], length: 1 };

      var wrap = el('div', { style: 'flex:1;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start' });
      var cv = el('canvas', { style: 'box-shadow:0 0 0 1px var(--line), 0 20px 50px -30px #000;background:#fff;max-width:100%' });
      wrap.appendChild(cv);
      var info = el('div', { class: 'meta' });
      parts.stage.appendChild(wrap); parts.stage.appendChild(info);

      var listBox = el('div', { style: 'display:flex;flex-direction:column;gap:10px' });
      var input = el('input', { type: 'file', accept: 'image/*', multiple: true, style: 'display:none' });
      input.addEventListener('change', function () {
        var files = [].slice.call(input.files);
        Promise.all(files.map(function (f) {
          return NV.loadImage(f).then(function (img) {
            return { name: f.name.replace(/\.[^.]+$/, ''), img: img, cm: 20, qty: 1, rot: true };
          });
        })).then(function (added) {
          items = items.concat(added);
          input.value = '';
          renderList(); update();
        });
      });

      function renderList() {
        listBox.innerHTML = '';
        if (!items.length) {
          listBox.appendChild(el('p', { class: 'hint', text: 'Aún no hay diseños. Añade PNG con fondo transparente y define el ancho de cada uno en centímetros.' }));
          return;
        }
        items.forEach(function (it, i) {
          var row = el('div', { style: 'border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px' });
          var top = el('div', { style: 'display:flex;gap:10px;align-items:center' });
          var th = el('canvas', { width: 40, height: 40, style: 'flex:none;border-radius:4px;background:var(--ground)' });
          var tc = th.getContext('2d');
          var k = Math.min(40 / it.img.width, 40 / it.img.height);
          tc.drawImage(it.img, (40 - it.img.width * k) / 2, (40 - it.img.height * k) / 2, it.img.width * k, it.img.height * k);
          top.appendChild(th);
          top.appendChild(el('div', { style: 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px', text: it.name }));
          top.appendChild(el('button', {
            class: 'btn ghost', style: 'padding:4px 9px', text: '✕', title: 'Quitar',
            onclick: function () { items.splice(i, 1); renderList(); update(); }
          }));
          row.appendChild(top);

          var g = el('div', { class: 'row' });
          var wIn = el('input', { type: 'number', value: it.cm, min: 1, max: 200, step: 0.5, title: 'Ancho en cm' });
          var qIn = el('input', { type: 'number', value: it.qty, min: 1, max: 200, step: 1, title: 'Cantidad' });
          wIn.addEventListener('input', function () { it.cm = Math.max(0.5, +wIn.value || 1); update(); });
          qIn.addEventListener('input', function () { it.qty = Math.max(1, Math.min(200, +qIn.value || 1)); update(); });
          g.appendChild(el('label', { class: 'field' }, [el('span', { class: 'flabel', html: '<span>Ancho</span><b>cm</b>' }), wIn]));
          g.appendChild(el('label', { class: 'field' }, [el('span', { class: 'flabel', html: '<span>Cantidad</span><b>pzas</b>' }), qIn]));
          row.appendChild(g);

          var rc = el('input', { type: 'checkbox' });
          rc.checked = it.rot;
          rc.addEventListener('change', function () { it.rot = rc.checked; update(); });
          row.appendChild(el('label', { class: 'check' }, [rc, el('span', { text: 'Puede girar 90°' })]));
          listBox.appendChild(row);
        });
      }

      function update() {
        packed = pack(items, st.ancho, st.gap, st.margen);
        var largo = Math.max(st.margen * 2 + 1, packed.length);
        var pxcm = 900 / st.ancho;
        cv.width = Math.round(st.ancho * pxcm);
        cv.height = Math.max(40, Math.round(largo * pxcm));
        cv.style.width = Math.min(900, cv.width) + 'px';
        draw(cv, st, packed, false);
        var areaUsada = packed.places.reduce(function (a, p) { return a + p.w * p.h; }, 0);
        var areaHoja = st.ancho * largo;
        info.textContent = packed.places.length + ' piezas · ' + largo.toFixed(1) + ' cm de largo (' +
          (largo / 100).toFixed(2) + ' m) · aprovechado ' + Math.round(areaUsada / areaHoja * 100) + ' %';
      }

      NV.controls(parts.body, [
        { k: 'select', id: 'ancho', label: 'Ancho del rollo', def: '58', opts: [['30', '30 cm'], ['33', '33 cm'], ['40', '40 cm'], ['55', '55 cm'], ['58', '58 cm'], ['60', '60 cm'], ['62', '62 cm']] },
        { k: 'num', id: 'dpi', label: 'Resolución de salida', unit: 'DPI', def: 300, min: 100, max: 720, step: 10 },
        { k: 'range', id: 'gap', label: 'Separación entre piezas', min: 0, max: 4, step: 0.1, def: 0.5, unit: ' cm', dec: 1 },
        { k: 'range', id: 'margen', label: 'Margen del rollo', min: 0, max: 4, step: 0.1, def: 0.5, unit: ' cm', dec: 1 },
        { k: 'check', id: 'fondo', label: 'Exportar con fondo de color', def: false },
        { k: 'color', id: 'color', label: 'Color del fondo', def: '#ffffff', show: function (p) { return p.fondo; } }
      ], st, function () { st.ancho = +st.ancho; update(); }).sync();

      parts.body.appendChild(el('div', { class: 'sep' }));
      parts.body.appendChild(el('div', { class: 'group-t', text: 'Diseños en la hoja' }));
      parts.body.appendChild(el('button', { class: 'btn wide', text: 'Añadir diseños', onclick: function () { input.click(); } }));
      parts.body.appendChild(input);
      parts.body.appendChild(listBox);
      parts.body.appendChild(el('p', { class: 'hint', text: 'El acomodo usa estanterías por altura, igual que un RIP: ordena de mayor a menor y rellena cada fila.' }));

      parts.foot.appendChild(el('button', {
        class: 'btn primary wide', text: 'Descargar hoja PNG',
        onclick: function () {
          if (!items.length) return NV.toast('Añade al menos un diseño.', 'bad');
          var largo = packed.length, pxcm = st.dpi / CM;
          var W = Math.round(st.ancho * pxcm), H = Math.round(largo * pxcm);
          if (W * H > 160e6) return NV.toast('La hoja es enorme a ' + st.dpi + ' DPI. Baja los DPI o divide el pedido.', 'bad');
          var out = document.createElement('canvas');
          out.width = W; out.height = H;
          draw(out, st, packed, true);
          NV.blobOf(out).then(function (b) { return NV.pngWithDpi(b, st.dpi); })
            .then(function (b) {
              NV.download(b, 'hoja-' + st.ancho + 'cm-' + largo.toFixed(0) + 'cm.png');
              NV.toast('Hoja de ' + W + ' × ' + H + ' px lista.', 'ok');
            });
        }
      }));
      parts.foot.appendChild(el('button', {
        class: 'btn ghost wide', text: 'Descargar lista (CSV)',
        onclick: function () {
          var rows = [['Diseño', 'Ancho cm', 'Alto cm', 'Cantidad', 'Área cm2']];
          items.forEach(function (it) {
            var h = it.cm * it.img.height / it.img.width;
            rows.push([it.name, it.cm.toFixed(1), h.toFixed(1), it.qty, (it.cm * h * it.qty).toFixed(1)]);
          });
          rows.push([]);
          rows.push(['Largo total cm', packed.length.toFixed(1)]);
          rows.push(['Ancho rollo cm', st.ancho]);
          var csv = rows.map(function (r) { return r.join(','); }).join('\n');
          NV.download(new Blob([csv], { type: 'text/csv' }), 'hoja-de-impresion.csv');
        }
      }));

      renderList(); update();
    }
  });
})();
