<title>Open Press DTF</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"></noscript>
<style>
/* Open Press — visual system */

:root{
  color-scheme: dark;
  --ground:#13110F;
  --sheet:#1B1815;
  --raise:#232019;
  --sunk:#0E0C0B;
  --line:#342E27;
  --line-soft:#262119;
  --text:#F3EEE6;
  --dim:#A99E8F;
  --mute:#7B7266;
  --accent:#FF2D7E;
  --accent-soft:rgba(255,45,126,.14);
  --on-accent:#1A0710;
  --cyan:#2BBBD8;
  --amber:#F2B01E;
  --ok:#4FD08A;
  --bad:#FF6B5C;
  --check-a:#2A2521;
  --check-b:#211D19;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.9);
  --rail:340px;
  --r-sm:3px; --r-md:6px; --r-lg:10px;
  --f-display:'Archivo','Archivo Black',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --ground:#F4F0E7; --sheet:#FFFDF8; --raise:#EDE7DA; --sunk:#E4DDCE;
    --line:#D8CFBD; --line-soft:#E6DFD1;
    --text:#191512; --dim:#615749; --mute:#8A8073;
    --accent:#D1005F; --accent-soft:rgba(209,0,95,.10); --on-accent:#FFF;
    --cyan:#0B7C96; --amber:#9A6B00; --ok:#1E7B4E; --bad:#C0392B;
    --check-a:#E8E1D3; --check-b:#F4F0E7;
    --shadow:0 1px 2px rgba(80,66,44,.10), 0 12px 30px -20px rgba(80,66,44,.5);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --ground:#F4F0E7; --sheet:#FFFDF8; --raise:#EDE7DA; --sunk:#E4DDCE;
  --line:#D8CFBD; --line-soft:#E6DFD1;
  --text:#191512; --dim:#615749; --mute:#8A8073;
  --accent:#D1005F; --accent-soft:rgba(209,0,95,.10); --on-accent:#FFF;
  --cyan:#0B7C96; --amber:#9A6B00; --ok:#1E7B4E; --bad:#C0392B;
  --check-a:#E8E1D3; --check-b:#F4F0E7;
  --shadow:0 1px 2px rgba(80,66,44,.10), 0 12px 30px -20px rgba(80,66,44,.5);
}

*{box-sizing:border-box}
/* min-height, not height: a fixed 100% caps body's box at one viewport, and a
   position:sticky child can only stick inside its parent's box - the top bar
   would come unstuck the moment you scrolled past the first screenful. */
html,body{min-height:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:800; text-wrap:balance; margin:0; line-height:1.04; letter-spacing:-.015em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--mute);
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:18px;
  padding:0 18px; height:56px;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; flex:none}
.brand .mark{width:26px;height:26px;flex:none;color:var(--accent)}
.brand b{font-family:var(--f-display); font-weight:800; font-size:17px; letter-spacing:.01em; text-transform:uppercase}
.brand span{font-family:var(--f-mono); font-size:10px; letter-spacing:.18em; color:var(--mute); text-transform:uppercase}
.topnav{display:flex; align-items:center; gap:4px; margin-left:auto}
.topnav a,.iconbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px; border-radius:var(--r-md); text-decoration:none;
  font-size:13px; color:var(--dim); border:1px solid transparent;
  background:none; cursor:pointer;
}
.topnav a:hover,.iconbtn:hover{color:var(--text); background:var(--raise)}
.topnav a.on{color:var(--text); border-color:var(--line); background:var(--sheet)}
.iconbtn svg{width:16px;height:16px}

/* tools menu */
.picker{position:relative}
.picker-menu{
  position:absolute; right:0; top:calc(100% + 8px); width:min(560px,92vw);
  background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow); padding:8px; display:none;
  grid-template-columns:1fr 1fr; gap:2px; max-height:70vh; overflow:auto;
}
.picker.open .picker-menu{display:grid}
.picker-menu a{
  display:block; padding:8px 10px; border-radius:var(--r-md);
  text-decoration:none; font-size:13.5px; line-height:1.3;
}
.picker-menu a small{display:block; color:var(--mute); font-size:11.5px}
.picker-menu a:hover{background:var(--raise)}
.picker-menu .head{grid-column:1/-1; padding:10px 10px 4px}

/* ---------- home ---------- */
.ruler{height:26px; border-bottom:1px solid var(--line); position:relative; overflow:hidden; background:var(--sunk)}
.ruler::before{
  content:''; position:absolute; inset:0;
  background:
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 20px),
    repeating-linear-gradient(90deg, color-mix(in srgb,var(--accent) 55%, transparent) 0 1px, transparent 1px 100px);
  background-position:0 60%, 0 0;
  background-size:auto 40%, auto 100%;
  background-repeat:repeat-x;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 22px}
.hero{position:relative; padding:64px 0 40px; overflow:hidden}
.hero canvas{position:absolute; inset:0; width:100%; height:100%; opacity:.5; pointer-events:none}
.hero-in{position:relative; max-width:660px}
.hero h1{font-size:clamp(38px,6.4vw,74px); text-transform:uppercase; letter-spacing:-.03em}
.hero h1 em{font-style:normal; color:var(--accent)}
.hero p{color:var(--dim); font-size:17px; margin:16px 0 0; max-width:52ch}
.badges{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.badge{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:100px; padding:5px 11px; color:var(--dim);
  background:var(--sheet);
}
.badge.hot{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

.sheet-head{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  padding:34px 0 14px; border-bottom:1px solid var(--line); margin-bottom:22px;
}
.sheet-head h2{font-size:22px; text-transform:uppercase; letter-spacing:.02em}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:14px; padding-bottom:26px}
.card{
  position:relative; display:flex; flex-direction:column; gap:9px;
  padding:18px; text-decoration:none;
  background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg);
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.card:hover{transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent) 55%,var(--line)); box-shadow:var(--shadow)}
.card .ico{width:30px;height:30px;color:var(--accent)}
.card h3{font-size:16.5px; letter-spacing:0; font-weight:700}
.card p{margin:0; color:var(--dim); font-size:13.5px; line-height:1.45}
.card .num{
  position:absolute; top:14px; right:16px;
  font-family:var(--f-mono); font-size:11px; color:var(--mute);
}
.card::after{
  content:''; position:absolute; left:0; top:14px; bottom:14px; width:2px;
  background:var(--accent); opacity:0; border-radius:2px; transition:opacity .16s;
}
.card:hover::after{opacity:.85}

/* ---------- workbench ---------- */
.bench{display:grid; grid-template-columns:var(--rail) 1fr; height:calc(100vh - 56px)}
.rail{
  border-right:1px solid var(--line); background:var(--sheet);
  overflow-y:auto; display:flex; flex-direction:column;
}
.rail-head{padding:18px 18px 14px; border-bottom:1px solid var(--line-soft)}
.rail-head h1{font-size:21px; text-transform:uppercase; letter-spacing:.01em}
.rail-head p{margin:7px 0 0; color:var(--dim); font-size:13px}
.rail-body{padding:14px 18px 18px; display:flex; flex-direction:column; gap:15px; flex:1}
.rail-foot{
  position:sticky; bottom:0; padding:12px 18px;
  border-top:1px solid var(--line); background:var(--sheet);
  display:flex; flex-direction:column; gap:8px;
}
.stage{position:relative; background:var(--sunk); overflow:hidden; display:flex; flex-direction:column}

/* controls */
.field{display:flex; flex-direction:column; gap:7px}
.field > label,.flabel{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  font-size:12.5px; color:var(--dim);
}
.flabel b{font-family:var(--f-mono); font-size:12px; color:var(--text); font-weight:500; font-variant-numeric:tabular-nums}
.hint{font-size:11.5px; color:var(--mute); line-height:1.4; margin:0}
.sep{height:1px; background:var(--line-soft); margin:2px 0}
.group-t{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--mute); margin-top:4px;
}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:18px; background:none; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:3px; background:var(--line); border-radius:3px}
input[type=range]::-moz-range-track{height:3px; background:var(--line); border-radius:3px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px;height:15px;border-radius:50%;
  background:var(--accent); margin-top:-6px; border:2px solid var(--sheet);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--sheet)
}
input[type=text],input[type=number],select,textarea{
  width:100%; padding:8px 10px; background:var(--ground);
  border:1px solid var(--line); border-radius:var(--r-md); font-size:13.5px;
}
input[type=number]{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
select{cursor:pointer}
.seg{display:flex; background:var(--ground); border:1px solid var(--line); border-radius:var(--r-md); padding:2px; gap:2px}
.seg button{
  flex:1; padding:6px 4px; font-size:12.5px; border:0; border-radius:4px;
  background:none; color:var(--dim); cursor:pointer; white-space:nowrap;
}
.seg button.on{background:var(--accent); color:var(--on-accent); font-weight:600}
.seg button:hover:not(.on){color:var(--text)}
.check{display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer; color:var(--dim)}
.check input{accent-color:var(--accent); width:15px;height:15px; cursor:pointer}
.check:hover{color:var(--text)}
.row{display:flex; gap:8px} .row > *{flex:1; min-width:0}
.swatch{
  width:100%; height:32px; padding:0; border:1px solid var(--line);
  border-radius:var(--r-md); background:none; cursor:pointer;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 14px; border-radius:var(--r-md); border:1px solid var(--line);
  background:var(--raise); color:var(--text); font-size:13.5px; font-weight:600;
  cursor:pointer; text-decoration:none; transition:filter .12s, border-color .12s;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.ghost{background:none}
.btn.wide{width:100%}
.btn svg{width:15px;height:15px}

/* drop zone */
.drop{
  flex:1; margin:20px; border:1.5px dashed var(--line); border-radius:var(--r-lg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center; padding:30px; cursor:pointer; color:var(--dim);
  transition:border-color .15s, background .15s;
}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--text)}
.drop svg{width:38px;height:38px; color:var(--mute)}
.drop.over svg,.drop:hover svg{color:var(--accent)}
.drop b{font-family:var(--f-display); font-size:18px; text-transform:uppercase}
.drop small{font-size:12px; color:var(--mute); max-width:38ch}

/* viewer */
.viewer{flex:1; position:relative; overflow:hidden; cursor:grab}
.viewer.drag{cursor:grabbing}
.plate{position:absolute; left:50%; top:50%; transform-origin:0 0; will-change:transform}
.plate{
  background-image:
    linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),
    linear-gradient(45deg,var(--check-a) 25%,var(--check-b) 25%,var(--check-b) 75%,var(--check-a) 75%);
  background-size:18px 18px; background-position:0 0,9px 9px;
}
.plate canvas{position:absolute; left:0; top:0; display:block; image-rendering:pixelated}
.plate.smooth canvas{image-rendering:auto}
.plate .divider{
  position:absolute; top:0; bottom:0; width:1px; background:var(--accent);
  box-shadow:0 0 0 1px rgba(0,0,0,.35); display:none;
}
.viewer.cmp .divider{display:block}
.toolbar{
  position:absolute; left:12px; bottom:12px; z-index:5; display:flex; gap:4px;
  background:color-mix(in srgb,var(--sheet) 92%,transparent); backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:var(--r-md); padding:4px;
}
.toolbar button{
  min-width:32px; height:30px; padding:0 9px; border:0; border-radius:4px;
  background:none; color:var(--dim); cursor:pointer; font-size:12px;
  font-family:var(--f-mono); display:inline-flex; align-items:center; justify-content:center;
}
.toolbar button:hover{background:var(--raise); color:var(--text)}
.toolbar button.on{background:var(--accent); color:var(--on-accent)}
.meta{
  position:absolute; right:12px; bottom:12px; z-index:5;
  font-family:var(--f-mono); font-size:11px; color:var(--mute);
  background:color-mix(in srgb,var(--sheet) 92%,transparent);
  border:1px solid var(--line); border-radius:var(--r-md); padding:6px 10px;
}
.busy{
  position:absolute; inset:0; z-index:8; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:12px;
  background:color-mix(in srgb,var(--sunk) 72%,transparent);
  font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);
}
.busy.on{display:flex}
.spin{
  width:28px;height:28px;border:2px solid var(--line); border-top-color:var(--accent);
  border-radius:50%; animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .spin{animation-duration:2s}
  .card{transition:none}
}

/* reference pages */
.doc{padding:30px 0 60px}
.doc h2{font-size:26px; text-transform:uppercase; margin:34px 0 12px}
.doc h3{font-size:17px; margin:22px 0 8px}
.doc p{color:var(--dim); max-width:68ch}
.panelbox{background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line-soft)}
th{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); font-weight:400}
td.num,th.num{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--raise)}
.scroll-x{overflow-x:auto}
.pill{
  display:inline-block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 8px; border-radius:100px;
  border:1px solid var(--line); color:var(--dim);
}
.pill.c{color:var(--cyan); border-color:color-mix(in srgb,var(--cyan) 50%,transparent)}
.pill.m{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.pill.y{color:var(--amber); border-color:color-mix(in srgb,var(--amber) 50%,transparent)}

/* notices */
.toasts{position:fixed; right:16px; bottom:16px; z-index:200; display:flex; flex-direction:column; gap:8px}
.toast{
  background:var(--sheet); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--r-md); padding:11px 15px; font-size:13px; box-shadow:var(--shadow);
  max-width:340px; animation:in .22s ease;
}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)}
@keyframes in{from{opacity:0; transform:translateY(6px)}}

.foot{border-top:1px solid var(--line); padding:26px 0 40px; color:var(--mute); font-size:12.5px}
.foot a{color:var(--dim)}
.foot .cols{display:flex; gap:30px; flex-wrap:wrap; justify-content:space-between}

@media (max-width:900px){
  .bench{grid-template-columns:1fr; height:auto}
  .rail{border-right:0; border-bottom:1px solid var(--line); max-height:none; overflow:visible; order:2}
  /* The control rail runs far longer than a phone screen, so pin the preview
     under the top bar: you can see what a slider is doing while you drag it. */
  .stage{
    order:1; height:46vh; min-height:230px;
    position:sticky; top:56px; z-index:5;
    border-bottom:1px solid var(--line);
  }
  .rail-foot{position:sticky; bottom:0}
  .picker-menu{grid-template-columns:1fr}
}
@media (max-width:900px) and (orientation:landscape){
  .stage{height:62vh}
}
@media print{
  .topbar,.foot,.ruler,.no-print{display:none}
  body{background:#fff; color:#000}
  .panelbox{border-color:#ccc}
}

<script>
/* Image-processing primitives. Everything runs in the browser. */
(function (root) {
  'use strict';
  var IM = {};
  var INF = 1e20;

  IM.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

  IM.copy = function (id) {
    return new ImageData(new Uint8ClampedArray(id.data), id.width, id.height);
  };

  IM.blank = function (w, h) { return new ImageData(w, h); };

  IM.canvasOf = function (id) {
    var c = document.createElement('canvas');
    c.width = id.width; c.height = id.height;
    c.getContext('2d').putImageData(id, 0, 0);
    return c;
  };

  IM.dataOf = function (src, w, h) {
    w = w || src.naturalWidth || src.width;
    h = h || src.naturalHeight || src.height;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(src, 0, 0, w, h);
    return x.getImageData(0, 0, w, h);
  };

  /* Progressive rescaling: when shrinking, halving at a time preserves detail. */
  IM.resize = function (src, w, h, smooth) {
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    var cur = src.width ? src : IM.canvasOf(src);
    if (src instanceof ImageData) cur = IM.canvasOf(src);
    if (smooth === false) {
      var o = document.createElement('canvas'); o.width = w; o.height = h;
      var oc = o.getContext('2d'); oc.imageSmoothingEnabled = false;
      oc.drawImage(cur, 0, 0, w, h);
      return o;
    }
    while (cur.width > w * 2 && cur.height > h * 2) {
      var half = document.createElement('canvas');
      half.width = Math.max(w, cur.width >> 1);
      half.height = Math.max(h, cur.height >> 1);
      var hc = half.getContext('2d');
      hc.imageSmoothingEnabled = true; hc.imageSmoothingQuality = 'high';
      hc.drawImage(cur, 0, 0, half.width, half.height);
      cur = half;
    }
    var out = document.createElement('canvas'); out.width = w; out.height = h;
    var ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(cur, 0, 0, w, h);
    return out;
  };

  /* --- Exact distance transform (Felzenszwalb & Huttenlocher) --- */
  function dt1d(f, d, v, z, idx, srcIdx, n) {
    var k = 0, q, s;
    v[0] = 0; z[0] = -INF; z[1] = INF;
    for (q = 1; q < n; q++) {
      s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) {
        k--;
        s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      }
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    k = 0;
    for (q = 0; q < n; q++) {

        var y = (i * sn + j * cs) * cell + h * 0.45;

        var d = Math.sqrt(dx * dx + dy * dy);

  }

<script>
/* DTF check: audits a file for print readiness and fixes what it finds. */
(function () {
  'use strict';
  var el = NV.el, CM = 2.54;

  function analyse(src, full, p) {
    var d = src.data, n = src.width * src.height, i;
    var semi = 0, opaque = 0, clear = 0, sat = 0, lum = 0, white = 0, satN = 0;
    for (i = 0; i < n; i++) {
      var a = d[i * 4 + 3];
      if (a < 8) { clear++; continue; }
      if (a < 248) semi++;
      opaque++;
      var r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      sat += mx ? (mx - mn) / mx : 0;
      lum += (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      if (mx > 244 && mn > 236) white++;
      satN++;
    }
    /* Corners tell you whether a background was ever removed. */
    var w = src.width, h = src.height;
    var corners = [0, w - 1, (h - 1) * w, h * w - 1].map(function (k) { return d[k * 4 + 3]; });
    var cornerOpaque = corners.filter(function (a) { return a > 200; }).length;

    var dpi = full.width / (p.printWidthCm / CM);
    var printHeightCm = full.height / dpi * CM;

    /* Thinnest strokes: how much of the art sits within half a millimetre of an edge. */
    var sdf = IM.alphaSDF(src, 128);
    var pxPerMm = src.width / (p.printWidthCm * 10);
    var thinPx = 0.35 * pxPerMm;
    var thin = 0;
    for (i = 0; i < n; i++) if (sdf[i] > 0 && sdf[i] < thinPx) thin++;

    /* The analysis runs on the preview, so scale counts back to the real file. */
    var k2 = (full.width * full.height) / n;
    return {
      n: n, semi: semi, semiFull: Math.round(semi * k2), opaque: opaque, clear: clear,
      semiPct: opaque ? semi / opaque * 100 : 0,
      coverage: clear < n ? (n - clear) / n * 100 : 0,
      sat: satN ? sat / satN * 100 : 0,
      lum: satN ? lum / satN * 100 : 0,
      whitePct: opaque ? white / opaque * 100 : 0,
      thinPct: opaque ? thin / opaque * 100 : 0,
      cornerOpaque: cornerOpaque, hasAlpha: clear > n * 0.005,
      dpi: dpi, printHeightCm: printHeightCm,
      fullW: full.width, fullH: full.height
    };
  }

  function verdicts(a, p) {
    var v = [];
    v.push({
      n: '01', t: 'Semi-transparency',
      grade: a.semiPct < 0.5 ? 'good' : a.semiPct < 3 ? 'ok' : 'bad',
      text: a.semiPct < 0.5
        ? 'Only ' + NV.fmt(a.semiPct, 2) + ' % of the artwork has partial alpha. Nothing to fix.'
        : NV.fmt(a.semiFull, 0) + ' px are semi-transparent (' + NV.fmt(a.semiPct, 1) +
          ' %). White ink cannot print partial alpha, so these come out dirty or grey at the edges.'
    });
    v.push({
      n: '02', t: 'Background',
      grade: !a.hasAlpha ? 'bad' : a.cornerOpaque > 0 ? 'ok' : 'good',
      text: !a.hasAlpha
        ? 'The file has no transparency at all. The background will print as a solid rectangle.'
        : a.cornerOpaque > 0
          ? a.cornerOpaque + ' of 4 corners are still opaque. Check that no background is left behind.'
          : 'Transparent background, corners clear. Ready for DTF.'
    });
    v.push({
      n: '03', t: 'Resolution',
      grade: a.dpi >= 290 ? 'good' : a.dpi >= 180 ? 'ok' : 'bad',
      text: NV.fmt(a.dpi, 0) + ' DPI · ' + a.fullW + ' × ' + a.fullH + ' px at ' +
        NV.fmt(p.printWidthCm, 1) + ' × ' + NV.fmt(a.printHeightCm, 1) + ' cm. ' +
        (a.dpi >= 290 ? 'Optimal for DTF.'
          : a.dpi >= 180 ? 'Usable, but the edges will soften. Upscale if you can.'
            : 'Too low: this will print visibly pixelated. Upscale or print smaller.')
    });
    v.push({
      n: '04', t: 'Colour',
      grade: a.sat >= 30 ? 'good' : a.sat >= 18 ? 'ok' : 'bad',
      text: 'Average saturation ' + NV.fmt(a.sat, 0) + ' %, brightness ' + NV.fmt(a.lum, 0) + ' %. ' +
        (a.sat >= 30 ? 'Colour has enough punch for film.'
          : 'DTF lays down a little flatter than the screen. A touch of vibrance and contrast helps.')
    });
    v.push({
      n: '05', t: 'Fine detail',
      grade: a.thinPct < 4 ? 'good' : a.thinPct < 12 ? 'ok' : 'bad',
      text: NV.fmt(a.thinPct, 1) + ' % of the artwork sits within 0.35 mm of an edge. ' +
        (a.thinPct < 4 ? 'Strokes are thick enough to transfer cleanly.'
          : 'There are hairlines this thin. They tend to lift off the film or vanish under the press — thicken them or print larger.')
    });
    v.push({
      n: '06', t: 'White ink and film',
      grade: 'info',
      text: 'The art covers ' + NV.fmt(a.coverage, 0) + ' % of the canvas' +
        (a.whitePct > 12 ? ', and ' + NV.fmt(a.whitePct, 0) + ' % of it is near-white — that area leans on the white underbase, so keep the press firm.' : '.')
    });
    return v;
  }

  var GRADE = {
    good: ['Good', 'var(--ok)'], ok: ['Check', 'var(--amber)'],
    bad: ['Fix', 'var(--bad)'], info: ['Note', 'var(--dim)']
  };

  NV.register({
    slug: 'dtf-check',
    name: 'DTF file check',
    group: 'Cutout cleanup',
    tagline: 'Audit a file before it costs you film: alpha, background, DPI, colour and hairlines.',
    icon: NV.svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v3.5M11 14.5v.01"/>'),
    intro: 'Six checks on the file you are about to send to the printer. Anything it flags, it can also fix here — then download the corrected PNG.',
    debounce: 260,
    controls: [
      { k: 'num', id: 'printWidthCm', label: 'Print it at this width', unit: 'cm', def: 28, min: 1, max: 300, step: 0.5 },
      { k: 'note', text: 'Every verdict below is measured against that width. Change it and the report re-runs.' },
      { k: 'group', label: 'Fixes' },
      { k: 'check', id: 'fixSemi', label: 'Correct semi-transparency', def: false },
      { k: 'range', id: 'semiLo', label: 'Erase below', min: 0, max: 254, step: 1, def: 40, unit: ' alpha', show: function (p) { return p.fixSemi; } },
      { k: 'range', id: 'semiHi', label: 'Solidify above', min: 1, max: 255, step: 1, def: 190, unit: ' alpha', show: function (p) { return p.fixSemi; } },
      { k: 'check', id: 'fixHalo', label: 'Remove the edge halo', def: false },
      { k: 'check', id: 'fixColor', label: 'Lift colour for film', def: false },
      { k: 'range', id: 'vibrance', label: 'Vibrance', min: 0, max: 60, step: 1, def: 18, unit: '', show: function (p) { return p.fixColor; } },
      { k: 'range', id: 'contrast', label: 'Contrast', min: 0, max: 40, step: 1, def: 10, unit: '', show: function (p) { return p.fixColor; } },
      { k: 'note', text: 'With no fixes ticked the preview is your untouched file, so you can compare against the report.' }
    ],
    setup: function (api) {
      var box = el('div', { style: 'display:flex;flex-direction:column;gap:9px' });
      var body = document.querySelector('.rail-body');
      body.insertBefore(box, body.querySelector('.group-t'));
      api.state.custom.report = box;
    },
    process: function (c) {
      var a = analyse(c.src, c.state.full, c.p);
      var box = c.state.custom.report;
      if (box) {
        box.innerHTML = '';
        box.appendChild(el('div', { class: 'group-t', style: 'margin:0', text: 'Report' }));
        verdicts(a, c.p).forEach(function (v) {
          var g = GRADE[v.grade];
          var card = el('div', {
            style: 'border:1px solid var(--line);border-left:3px solid ' + g[1] +
              ';border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:4px'
          });
          card.appendChild(el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;gap:8px' }, [
            el('span', { style: 'font-size:13px;font-weight:600', text: v.n + '  ' + v.t }),
            el('span', {
              class: 'mono',
              style: 'font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:' + g[1],
              text: g[0]
            })
          ]));
          card.appendChild(el('p', { class: 'hint', style: 'margin:0', text: v.text }));
          box.appendChild(card);
        });
      }

      var out = IM.copy(c.src), p = c.p;

/* Reduce edges: contracts the contour and removes the halo left by a cutout. */
(function () {

  function components(mask, w, h) {

      var id = sizes.length, count = 0;
      stack.push(i); lab[i] = id;

        var c = stack.pop(); count++;
        var x = c % w, y = (c / w) | 0;

        if (x < w - 1 && mask[c + 1] && lab[c + 1] < 0) { lab[c + 1] = id; stack.push(c + 1); }
        if (y > 0 && mask[c - w] && lab[c - w] < 0) { lab[c - w] = id; stack.push(c - w); }
        if (y < h - 1 && mask[c + w] && lab[c + w] < 0) { lab[c + w] = id; stack.push(c + w); }

      for (i = 0; i < n; i++) if (cs.lab[i] >= 0 && cs.sizes[cs.lab[i]] < specks) q[i * 4 + 3] = 0;

/* Resize: real physical size, with the DPI written into the PNG. */
(function () {
  'use strict';
  var CM = 2.54;

  function targetPx(p) {
    var d = Math.max(10, p.dpi || 300);
    if (p.unit === 'px') return { w: Math.round(p.width), h: Math.round(p.height) };
    if (p.unit === 'cm') return { w: Math.round(p.width / CM * d), h: Math.round(p.height / CM * d) };
    return { w: Math.round(p.width * d), h: Math.round(p.height * d) };
  }

  NV.register({
    slug: 'resize',
    name: 'Resize',
    group: 'Artwork prep',
    tagline: 'Set the real size in centimetres or inches, fix the DPI and frame it without distortion.',
    icon: NV.svg('<path d="M3 3h11v11H3z"/><path d="M10 10h11v11H10z"/>'),
    intro: 'Type the size in centimetres or inches and the DPI: the PNG comes out with the physical resolution written in, so the RIP places it at the right size.',
    debounce: 200,
    controls: [
      { k: 'seg', id: 'unit', label: 'Unit', def: 'cm', opts: [['cm', 'Centimetres'], ['in', 'Inches'], ['px', 'Pixels']] },
      { k: 'num', id: 'width', label: 'Width', def: 20, min: 0.1, step: 0.1 },
      { k: 'num', id: 'height', label: 'Height', def: 20, min: 0.1, step: 0.1 },
      { k: 'check', id: 'lock', label: 'Keep proportions', def: true },
      { k: 'num', id: 'dpi', label: 'Resolution', unit: 'DPI', def: 300, min: 30, max: 1200, step: 10 },
      { k: 'note', text: 'For DTF and screen printing, 300 DPI at final size is the standard. Below 150 the pixels start to show.' },
      { k: 'group', label: 'Framing' },
      { k: 'seg', id: 'fit', label: 'How to fit', def: 'contain', opts: [['contain', 'Fit'], ['cover', 'Fill'], ['stretch', 'Stretch']] },
      { k: 'check', id: 'flatten', label: 'Solid background instead of transparent', def: false },
      { k: 'color', id: 'color', label: 'Background colour', def: '#ffffff', show: function (p) { return p.flatten; } }
    ],
    onControl: function (c, p, state) {
      if (!state.full) return;
      var ar = state.full.width / state.full.height;
      if (c.id === 'unit') {
        var d = p.dpi, wpx = state.full.width, hpx = state.full.height;
        if (p.unit === 'px') { p.width = wpx; p.height = hpx; }
        else if (p.unit === 'cm') { p.width = +(wpx / d * CM).toFixed(1); p.height = +(hpx / d * CM).toFixed(1); }
        else { p.width = +(wpx / d).toFixed(2); p.height = +(hpx / d).toFixed(2); }
        return;
      }
      if (!p.lock) return;
      if (c.id === 'width') p.height = +(p.width / ar).toFixed(p.unit === 'px' ? 0 : 2);
      else if (c.id === 'height') p.width = +(p.height * ar).toFixed(p.unit === 'px' ? 0 : 2);
      else if (c.id === 'lock') p.height = +(p.width / ar).toFixed(p.unit === 'px' ? 0 : 2);
    },
    process: function (c) {
      var t = targetPx(c.p);
      var W = IM.clamp(t.w, 1, 20000), H = IM.clamp(t.h, 1, 20000);
      if (c.preview) {
        var lim = 1500, m = Math.max(W, H);
        if (m > lim) { W = Math.max(1, Math.round(W * lim / m)); H = Math.max(1, Math.round(H * lim / m)); }
      }
      var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      var ctx = cv.getContext('2d');
      if (c.p.flatten) { ctx.fillStyle = c.p.color; ctx.fillRect(0, 0, W, H); }
      var sw = c.src.width, sh = c.src.height, dw = W, dh = H, dx = 0, dy = 0;
      if (c.p.fit !== 'stretch') {
        var k = c.p.fit === 'cover' ? Math.max(W / sw, H / sh) : Math.min(W / sw, H / sh);
        dw = sw * k; dh = sh * k; dx = (W - dw) / 2; dy = (H - dh) / 2;
      }
      var pre = IM.resize(c.src, Math.max(1, Math.round(dw)), Math.max(1, Math.round(dh)));
      ctx.drawImage(pre, dx, dy);
      return ctx.getImageData(0, 0, W, H);
    }
  });
})();

<script>
/* Format converter with control over quality and file size. */
(function () {
  'use strict';
  var TYPES = { png: 'image/png', jpeg: 'image/jpeg', webp: 'image/webp' };

  function build(src, p, preview) {
    var w = src.width, h = src.height;
    var lim = p.capSize ? p.maxSide : 0;
    if (preview) lim = lim ? Math.min(lim, 1500) : Math.min(Math.max(w, h), 1500);
    if (lim && Math.max(w, h) > lim) {
      var k = lim / Math.max(w, h);
      w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    }
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    if (p.format === 'jpeg' || p.flatten) { ctx.fillStyle = p.color; ctx.fillRect(0, 0, w, h); }

    return cv;
  }

  NV.register({

      { k: 'check', id: 'capSize', label: 'Cap the longest side', def: false },
      { k: 'num', id: 'maxSide', label: 'Maximum side', unit: 'px', def: 2000, min: 64, max: 12000, step: 50, show: function (p) { return p.capSize; } },
      { k: 'num', id: 'dpi', label: 'DPI to write into the PNG', unit: 'DPI', def: 300, min: 30, max: 1200, step: 10, show: function (p) { return p.format === 'png'; } }

<script>
/* Halftones: dot screens and fades for DTF and screen printing. */
(function () {
  'use strict';

  var ANG = { c: 15, m: 75, y: 0, k: 45 };

  function shapePath(ctx, x, y, r, shape) {
    if (shape === 'circle') { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832); return; }
    if (shape === 'square') { ctx.rect(x - r * 0.886, y - r * 0.886, r * 1.772, r * 1.772); return; }
    if (shape === 'diamond') {
      var d = r * 1.25;
      ctx.moveTo(x, y - d); ctx.lineTo(x + d, y); ctx.lineTo(x, y + d); ctx.lineTo(x - d, y); ctx.closePath();
      return;
    }
    if (shape === 'cross') {
      var a = r * 1.3, b = r * 0.42;
      ctx.rect(x - a, y - b, a * 2, b * 2); ctx.rect(x - b, y - a, b * 2, a * 2);
      return;
    }
    ctx.rect(x - r * 1.6, y - r * 0.9, r * 3.2, r * 1.8);   // line
  }

  /* Average coverage of one cell: luminance and alpha from the source. */
  function sampler(id) {
    var w = id.width, h = id.height, p = id.data;
    return function (cx, cy, half) {
      var x0 = Math.max(0, Math.floor(cx - half)), x1 = Math.min(w - 1, Math.ceil(cx + half));
      var y0 = Math.max(0, Math.floor(cy - half)), y1 = Math.min(h - 1, Math.ceil(cy + half));
      if (x1 < x0 || y1 < y0) return null;
      var lum = 0, al = 0, r = 0, g = 0, b = 0, n = 0, x, y, i;
      var step = Math.max(1, Math.floor((x1 - x0) / 6));
      for (y = y0; y <= y1; y += step) for (x = x0; x <= x1; x += step) {
        i = (y * w + x) * 4;
        var a = p[i + 3] / 255;
        lum += (0.2126 * p[i] + 0.7152 * p[i + 1] + 0.0722 * p[i + 2]) / 255 * a;
        r += p[i] * a; g += p[i + 1] * a; b += p[i + 2] * a;
        al += a; n++;
      }
      if (!n) return null;
      return { lum: lum / n, a: al / n, r: al ? r / al : 0, g: al ? g / al : 0, b: al ? b / al : 0 };
    };
  }

  function ramp(p, x, y, w, h) {
    var t;
    if (p.dir === 'down') t = y / h;
    else if (p.dir === 'up') t = 1 - y / h;
    else if (p.dir === 'right') t = x / w;
    else if (p.dir === 'left') t = 1 - x / w;
    else {
      var dx = (x - w / 2) / (w / 2), dy = (y - h / 2) / (h / 2);
      t = Math.min(1, Math.sqrt(dx * dx + dy * dy));
    }
    var start = p.start / 100, end = p.end / 100;
    if (end <= start) end = start + 0.001;
    return IM.clamp((t - start) / (end - start), 0, 1);
  }

  function pass(ctx, src, p, cellPx, angleDeg, color, chan) {
    var w = src.width, h = src.height;
    var smp = sampler(src);
    var a = angleDeg * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
    var diag = Math.ceil(Math.sqrt(w * w + h * h) / cellPx) + 2;
    ctx.fillStyle = color || '#000';
    ctx.beginPath();
    for (var i = -diag; i <= diag; i++) for (var j = -diag; j <= diag; j++) {
      var x = (i * cs - j * sn) * cellPx + w / 2;
      var y = (i * sn + j * cs) * cellPx + h / 2;
      if (x < -cellPx || y < -cellPx || x > w + cellPx || y > h + cellPx) continue;
      var s = smp(x, y, cellPx / 2);
      if (!s || s.a < 0.02) continue;
      var cover = 1;
      if (p.mode === 'tone' || p.mode === 'both') {
        cover = chan ? chan(s) : (1 - s.lum / Math.max(0.001, s.a));
        cover = IM.clamp(cover, 0, 1) * s.a;
      } else cover = s.a;
      if (p.mode === 'fade' || p.mode === 'both') cover *= (1 - ramp(p, x, y, w, h));
      if (cover <= 0.004) continue;
      var r = 0.708 * cellPx * Math.sqrt(cover) * (p.weight / 100);
      if (p.ink === 'original') {
        ctx.fill(); ctx.beginPath();
        ctx.fillStyle = 'rgb(' + (s.r | 0) + ',' + (s.g | 0) + ',' + (s.b | 0) + ')';
        shapePath(ctx, x, y, r, p.shape);
        ctx.fill(); ctx.beginPath();
        continue;
      }
      shapePath(ctx, x, y, r, p.shape);
    }
    ctx.fill();
  }

  NV.register({
    slug: 'halftones',
    name: 'Halftones and fades',
    group: 'Print effects',
    tagline: 'Dot screens with angle and shape, and gradients that dissolve into dots.',
    icon: NV.svg('<circle cx="6" cy="6" r="3"/><circle cx="17" cy="6" r="2.2"/><circle cx="6" cy="17" r="2.2"/><circle cx="17" cy="17" r="1.2"/>'),
    intro: 'A dot fade is the right way to make a gradient in DTF: the printer cannot print partial alpha, but it can print solid dots that get smaller.',
    debounce: 160,
    controls: [
      { k: 'seg', id: 'mode', label: 'What to do', def: 'fade', opts: [['fade', 'Fade out'], ['tone', 'Screen tones'], ['both', 'Both']] },
      { k: 'range', id: 'cell', label: 'Dot size', min: 2, max: 40, step: 0.5, def: 8, unit: ' px', dec: 1, scale: true },
      { k: 'range', id: 'weight', label: 'Dot weight', min: 40, max: 160, step: 1, def: 100, unit: ' %' },
      { k: 'select', id: 'shape', label: 'Shape', def: 'circle', opts: [['circle', 'Circle'], ['square', 'Square'], ['diamond', 'Diamond'], ['cross', 'Cross'], ['line', 'Line']] },
      { k: 'range', id: 'angle', label: 'Screen angle', min: 0, max: 90, step: 1, def: 45, unit: '°' },
      { k: 'group', label: 'Fade', show: function (p) { return p.mode !== 'tone'; } },
      { k: 'select', id: 'dir', label: 'Direction', def: 'down', show: function (p) { return p.mode !== 'tone'; }, opts: [['down', 'Downward'], ['up', 'Upward'], ['right', 'To the right'], ['left', 'To the left'], ['center', 'Out from the centre']] },
      { k: 'range', id: 'start', label: 'Fade starts at', min: 0, max: 100, step: 1, def: 35, unit: ' %', show: function (p) { return p.mode !== 'tone'; } },
      { k: 'range', id: 'end', label: 'Fully gone at', min: 0, max: 100, step: 1, def: 95, unit: ' %', show: function (p) { return p.mode !== 'tone'; } },
      { k: 'group', label: 'Colour' },
      { k: 'seg', id: 'ink', label: 'Dot ink', def: 'original', opts: [['original', 'Original'], ['solid', 'One colour'], ['cmyk', 'CMYK']] },
      { k: 'color', id: 'tint', label: 'Ink colour', def: '#111111', show: function (p) { return p.ink === 'solid'; } },
      { k: 'note', text: 'CMYK splits into four screens at the classic angles (C 15°, M 75°, Y 0°, K 45°) to avoid moiré.', show: function (p) { return p.ink === 'cmyk'; } }
    ],
    process: function (c) {
      var src = c.src, w = src.width, h = src.height, p = c.p;
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      var cell = Math.max(1.2, p.cell);
      if (p.ink === 'cmyk') {
        ctx.globalCompositeOperation = 'source-over';
        var chans = [
          ['c', '#00AEEF', function (s) { return IM.clamp(1 - s.r / 255, 0, 1); }],
          ['m', '#EC008C', function (s) { return IM.clamp(1 - s.g / 255, 0, 1); }],
          ['y', '#FFF200', function (s) { return IM.clamp(1 - s.b / 255, 0, 1); }],
          ['k', '#231F20', function (s) { return IM.clamp(1 - Math.max(s.r, s.g, s.b) / 255, 0, 1); }]
        ];
        ctx.globalAlpha = 0.9;
        chans.forEach(function (ch) {
          var pp = Object.assign({}, p, { mode: p.mode === 'fade' ? 'both' : p.mode });
          pass(ctx, src, pp, cell, ANG[ch[0]], ch[1], ch[2]);
        });
        ctx.globalAlpha = 1;
      } else {
        pass(ctx, src, p, cell, p.angle, p.ink === 'solid' ? p.tint : '#000');
      }
      return ctx.getImageData(0, 0, w, h);
    }
  });
})();

    ['Amethyst', '#6a3b8f'], ['Sapphire', '#1b4f9c'], ['Aquamarine', '#7fc4d8'],
    ['Emerald', '#157a4e'], ['Peridot', '#a8c64c'], ['Topaz', '#e2a93b'],
    ['Sun', '#e06a21'], ['Gold Quartz', '#c99a3e'], ['Rose Gold', '#c98a79']
  ].map(function (s) { return { name: s[0], hex: s[1], rgb: IM.rgb(s[1]) }; });

  function nearestStone(r, g, b) {
    var best = STONES[0], bd = 1e9;
    for (var i = 0; i < STONES.length; i++) {
      var d = IM.colorDistance(r, g, b, STONES[i].rgb[0], STONES[i].rgb[1], STONES[i].rgb[2]);
      if (d < bd) { bd = d; best = STONES[i]; }
    }
    return best;
  }

  /* Where the stones go. Everything downstream reads this. */
  function place(src, p) {
    var w = src.width, h = src.height, d = src.data;
    var pxPerMm = w / Math.max(1, p.widthCm * 10);
    var stoneMm = SS[p.stone] || 2.8;
    var stonePx = stoneMm * pxPerMm;
    var pitch = (stoneMm + p.gap) * pxPerMm;
    if (pitch < 1.2) pitch = 1.2;

    var keep = new Uint8Array(w * h), i, n = w * h;
    for (i = 0; i < n; i++) {
      var a = d[i * 4 + 3];
      if (a < p.threshold) continue;
      if (p.ignoreLight) {
        var lum = 0.2126 * d[i * 4] + 0.7152 * d[i * 4 + 1] + 0.0722 * d[i * 4 + 2];
        if (lum > 242) continue;
      }
      keep[i] = 1;
    }
    if (p.mode === 'outline') {                       // stones only along the contour
      var sdf = IM.alphaSDF(src, p.threshold);
      var band = Math.max(stonePx, p.outlineMm * pxPerMm);
      for (i = 0; i < n; i++) if (keep[i] && (sdf[i] < 0 || sdf[i] > band)) keep[i] = 0;
    }

    var rowStep = p.layout === 'offset' ? pitch * 0.866 : pitch;   // hex rows sit closer
    var stones = [], counts = {};
    var half = stonePx / 2;
    for (var row = 0, y = half; y <= h - half + pitch; y += rowStep, row++) {
      var xoff = (p.layout === 'offset' && row % 2) ? pitch / 2 : 0;
      for (var x = half + xoff; x <= w - half; x += pitch) {
        var cover = 0, hits = 0, cr = 0, cg = 0, cb = 0;
        var x0 = Math.max(0, Math.round(x - half)), x1 = Math.min(w - 1, Math.round(x + half));
        var y0 = Math.max(0, Math.round(y - half)), y1 = Math.min(h - 1, Math.round(y + half));
        var st = Math.max(1, Math.floor((x1 - x0) / 5));
        for (var yy = y0; yy <= y1; yy += st) for (var xx = x0; xx <= x1; xx += st) {
          var k = yy * w + xx;
          hits++;
          if (!keep[k]) continue;
          cover++;
          cr += d[k * 4]; cg += d[k * 4 + 1]; cb += d[k * 4 + 2];
        }
        if (!hits || cover / hits < p.density / 100) continue;
        var stone = p.colorMode === 'source'
          ? nearestStone(cr / cover, cg / cover, cb / cover)
          : { name: 'Chosen colour', hex: p.stoneColor };
        stones.push({ x: x, y: y, r: half, hex: stone.hex });
        counts[stone.name] = (counts[stone.name] || 0) + 1;
      }
    }
    return {
      stones: stones, counts: counts, pxPerMm: pxPerMm,
      stoneMm: stoneMm, pitchMm: stoneMm + p.gap,
      heightCm: h / pxPerMm / 10
    };
  }

  function shade(hex, k) {
    var c = IM.rgb(hex);
    return 'rgb(' + c.map(function (v) {
      return Math.round(IM.clamp(k > 0 ? v + (255 - v) * k : v * (1 + k), 0, 255));
    }).join(',') + ')';
  }

  function draw(res, w, h, p) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    if (p.backdrop !== 'none') {
      ctx.fillStyle = p.backdrop === 'dark' ? '#14120f' : '#f4f1ea';
      ctx.fillRect(0, 0, w, h);
    }
    res.stones.forEach(function (s) {
      if (p.template) {                                // flat dots: the cutting template
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
        return;
      }
      var g = ctx.createRadialGradient(s.x - s.r * 0.32, s.y - s.r * 0.32, s.r * 0.1, s.x, s.y, s.r);
      g.addColorStop(0, shade(s.hex, 0.55));
      g.addColorStop(0.55, s.hex);
      g.addColorStop(1, shade(s.hex, -0.32));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
      if (s.r > 2.2) {
        ctx.strokeStyle = 'rgba(0,0,0,.25)';
        ctx.lineWidth = Math.max(0.4, s.r * 0.09);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.55)';      // the facet catching the light
        ctx.beginPath();
        ctx.arc(s.x - s.r * 0.3, s.y - s.r * 0.34, s.r * 0.2, 0, 6.2832);
        ctx.fill();
      }
    });
    return ctx.getImageData(0, 0, w, h);
  }

  NV.register({
    slug: 'rhinestones',
    name: 'Rhinestone patterns',
    group: 'Print effects',
    tagline: 'Turn artwork into a stud layout with the real stone count you need to order.',
    icon: NV.svg('<circle cx="12" cy="5.5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="12" r="2.4"/><circle cx="12" cy="18.5" r="2.4"/>'),
    intro: 'Stones sit on a real lattice at their real size, so the count and the layout match what you will actually stick down. Set the finished width first — everything is measured from it.',
    debounce: 200,
    controls: [
      { k: 'num', id: 'widthCm', label: 'Finished design width', unit: 'cm', def: 25, min: 2, max: 200, step: 0.5 },
      { k: 'select', id: 'stone', label: 'Stone size', def: 'ss10', opts: [['ss6', 'SS6 · 2.0 mm'], ['ss8', 'SS8 · 2.4 mm'], ['ss10', 'SS10 · 2.8 mm'], ['ss12', 'SS12 · 3.2 mm'], ['ss16', 'SS16 · 3.9 mm'], ['ss20', 'SS20 · 4.7 mm'], ['ss30', 'SS30 · 6.4 mm']] },
      { k: 'range', id: 'gap', label: 'Gap between stones', min: 0, max: 3, step: 0.1, def: 0.4, unit: ' mm', dec: 1 },
      { k: 'seg', id: 'layout', label: 'Layout', def: 'offset', opts: [['offset', 'Offset rows'], ['grid', 'Square grid']] },
      { k: 'group', label: 'Coverage' },
      { k: 'seg', id: 'mode', label: 'Fill', def: 'fill', opts: [['fill', 'Whole shape'], ['outline', 'Outline only']] },
      { k: 'range', id: 'outlineMm', label: 'Outline thickness', min: 1, max: 20, step: 0.5, def: 5, unit: ' mm', dec: 1, show: function (p) { return p.mode === 'outline'; } },
      { k: 'range', id: 'density', label: 'Place a stone from', min: 10, max: 90, step: 5, def: 45, unit: ' % cover' },
      { k: 'range', id: 'threshold', label: 'Alpha threshold', min: 8, max: 250, step: 2, def: 128, unit: '' },
      { k: 'check', id: 'ignoreLight', label: 'Skip near-white areas', def: false },
      { k: 'group', label: 'Stones' },
      { k: 'seg', id: 'colorMode', label: 'Colour', def: 'source', opts: [['source', 'Match artwork'], ['mono', 'One colour']] },
      { k: 'color', id: 'stoneColor', label: 'Stone colour', def: '#e8ecf2', show: function (p) { return p.colorMode === 'mono'; } },
      { k: 'check', id: 'template', label: 'Template view (flat dots for cutting)', def: false },
      { k: 'seg', id: 'backdrop', label: 'Preview on', def: 'none', opts: [['none', 'Transparent'], ['dark', 'Dark'], ['light', 'Light']] }
    ],
    setup: function (api) {
      var box = el('div', { style: 'border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px' });
      var body = document.querySelector('.rail-body');
      body.insertBefore(box, body.children[1] || null);   // right under the intro
      api.state.custom.report = box;
    },
    process: function (c) {
      var res = place(c.src, c.p);
      c.state.custom.last = res;
      var box = c.state.custom.report;
      if (box) {
        var names = Object.keys(res.counts).sort(function (a, b) { return res.counts[b] - res.counts[a]; });
        box.innerHTML = '';
        box.appendChild(el('div', { class: 'eyebrow', text: 'Stone count' }));
        box.appendChild(el('div', {
          style: 'font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;color:var(--accent)',
          text: NV.fmt(res.stones.length, 0)
        }));
        box.appendChild(el('p', {
          class: 'hint',
          text: res.stoneMm.toFixed(1) + ' mm stones · pitch ' + res.pitchMm.toFixed(1) + ' mm · ' +
            c.p.widthCm + ' × ' + res.heightCm.toFixed(1) + ' cm · ' +
            NV.fmt(Math.ceil(res.stones.length / 144), 0) + ' gross'
        }));
        if (names.length) {
          var t = el('table'), tb = el('tbody');
          names.forEach(function (n) {
            var hex = (STONES.filter(function (s) { return s.name === n; })[0] || {}).hex || c.p.stoneColor;
            tb.appendChild(el('tr', {}, [
              el('td', {}, [
                el('span', { style: 'display:inline-block;width:11px;height:11px;border-radius:50%;background:' + hex + ';border:1px solid var(--line);margin-right:7px;vertical-align:-1px' }),
                el('span', { text: n })
              ]),
              el('td', { class: 'num', text: NV.fmt(res.counts[n], 0) })
            ]));
          });
          t.appendChild(tb);
          box.appendChild(el('div', { class: 'scroll-x', style: 'max-height:230px;overflow-y:auto' }, [t]));
        }
      }
      return draw(res, c.src.width, c.src.height, c.p);
    },
    exports: [
      { label: 'Download PNG', ext: 'png' },
      {
        label: 'Download SVG template', ext: 'svg', secondary: true,
        make: function (api, done) {
          var res = place(api.src, api.params), p = api.params;
          var mm = function (v) { return +(v / res.pxPerMm).toFixed(2); };
          var W = mm(api.src.width), H = mm(api.src.height);
          var s = '<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" ' +
            'width="' + W + 'mm" height="' + H + 'mm" viewBox="0 0 ' + W + ' ' + H + '">\n' +
            '  <!-- ' + res.stones.length + ' stones, ' + res.stoneMm.toFixed(1) + ' mm, pitch ' + res.pitchMm.toFixed(1) + ' mm -->\n';
          res.stones.forEach(function (st) {
            s += '  <circle cx="' + mm(st.x) + '" cy="' + mm(st.y) + '" r="' + mm(st.r) +
              '" fill="' + (p.template ? '#000000' : st.hex) + '"/>\n';
          });
          NV.download(new Blob([s + '</svg>\n'], { type: 'image/svg+xml' }), api.name + '-rhinestones.svg');
          done();
        }
      },
      {
        label: 'Stone list (CSV)', ext: 'csv', secondary: true,
        make: function (api, done) {
          var res = api.state.custom.last || place(api.src, api.params);
          var rows = [['Colour', 'Stones', 'Gross']];
          Object.keys(res.counts).forEach(function (n) {
            rows.push([n, res.counts[n], Math.ceil(res.counts[n] / 144)]);
          });
          rows.push([]);
          rows.push(['Total', res.stones.length, Math.ceil(res.stones.length / 144)]);
          rows.push(['Stone size mm', res.stoneMm.toFixed(1)]);
          rows.push(['Design width cm', api.params.widthCm]);
          NV.download(new Blob([rows.map(function (r) { return r.join(','); }).join('\n')],
            { type: 'text/csv' }), api.name + '-stones.csv');
          done();
        }
      }
    ]
  });
})();

<script>
/* Frames and grunge: distress, dirty texture and workshop-style borders. */
(function () {
  'use strict';

  function distress(id, p) {
    var w = id.width, h = id.height, n = w * h, i;
    var out = IM.copy(id), q = out.data;
    var nz = IM.noise(w, h, Math.max(2, p.grain), 4, p.seed | 0);
    var edge = p.edgeOnly ? IM.alphaSDF(id, 128) : null;
    var thr = 1 - p.amount / 100;
    for (i = 0; i < n; i++) {
      var cut = IM.clamp((nz[i] - thr) / 0.12 + 0.5, 0, 1);
      if (edge) {
        var near = IM.clamp(1 - (edge[i] - 1) / Math.max(1, p.edgeWidth), 0, 1);
        cut = 1 - (1 - cut) * near;
      }
      q[i * 4 + 3] = q[i * 4 + 3] * cut;
    }
    return out;
  }

  function texture(id, p) {
    var w = id.width, h = id.height, n = w * h, i, k;
    var out = IM.copy(id), q = out.data;
    var nz = IM.noise(w, h, Math.max(2, p.grain), 5, (p.seed | 0) + 7);
    var amt = p.amount / 100;
    for (i = 0; i < n; i++) {
      var m = 1 - (1 - nz[i]) * amt;
      for (k = 0; k < 3; k++) q[i * 4 + k] = IM.clamp(q[i * 4 + k] * m, 0, 255);
    }
    return out;
  }

  function frame(id, p) {
    var w = id.width, h = id.height;
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.putImageData(id, 0, 0);
    var m = Math.min(w, h) * p.margin / 100;
    var g = Math.max(1, Math.min(w, h) * p.weight / 100);
    ctx.strokeStyle = p.color; ctx.lineWidth = g;
    ctx.beginPath();
    if (p.frame === 'circle') {
      ctx.arc(w / 2, h / 2, Math.min(w, h) / 2 - m - g / 2, 0, 6.2832);
    } else if (p.frame === 'rounded' || p.frame === 'stamp') {
      var r = Math.min(w, h) * 0.06;
      var x = m + g / 2, y = m + g / 2, ww = w - 2 * x, hh = h - 2 * y;
      if (ctx.roundRect) ctx.roundRect(x, y, ww, hh, r);
      else ctx.rect(x, y, ww, hh);
    } else {
      ctx.rect(m + g / 2, m + g / 2, w - 2 * m - g, h - 2 * m - g);
    }
    ctx.stroke();
    if (p.frame === 'stamp') {
      var m2 = m + g * 2.2;
      ctx.lineWidth = Math.max(1, g * 0.4);
      ctx.beginPath();
      ctx.rect(m2, m2, w - 2 * m2, h - 2 * m2);
      ctx.stroke();
    }
    return ctx.getImageData(0, 0, w, h);
  }

  NV.register({
    slug: 'frames-grunge',
    name: 'Frames and grunge',
    group: 'Print effects',
    tagline: 'Distress the artwork, add dirty texture and frame it with workshop character.',
    icon: NV.svg('<path d="M3 3h18v18H3z"/><path d="M7 8.5c1.5.6 2.5-.6 4 0s2.5 1 4 .3M7 13c2 .8 3-.7 4.5 0s2.6.9 4.5 0M8 17c1.5.5 2.4-.5 4 0"/>'),
    intro: 'Distress breaks up the alpha with fractal noise, the way a worn plate does. Texture dirties the colour without touching the cutout.',
    debounce: 220,
    controls: [
      { k: 'seg', id: 'effect', label: 'Effect', def: 'distress', opts: [['distress', 'Distress'], ['texture', 'Texture'], ['none', 'Frame only']] },
      { k: 'range', id: 'amount', label: 'Amount', min: 0, max: 95, step: 1, def: 40, unit: ' %', show: function (p) { return p.effect !== 'none'; } },
      { k: 'range', id: 'grain', label: 'Grain', min: 2, max: 120, step: 1, def: 18, unit: ' px', scale: true, show: function (p) { return p.effect !== 'none'; } },
      { k: 'range', id: 'seed', label: 'Variant', min: 1, max: 60, step: 1, def: 7, unit: '', show: function (p) { return p.effect !== 'none'; } },
      { k: 'check', id: 'edgeOnly', label: 'Distress the contour only', def: false, show: function (p) { return p.effect === 'distress'; } },
      { k: 'range', id: 'edgeWidth', label: 'Distress width', min: 2, max: 80, step: 1, def: 16, unit: ' px', scale: true, show: function (p) { return p.effect === 'distress' && p.edgeOnly; } },
      { k: 'group', label: 'Frame' },
      { k: 'select', id: 'frame', label: 'Type', def: 'none', opts: [['none', 'No frame'], ['square', 'Square'], ['rounded', 'Rounded'], ['circle', 'Circle'], ['stamp', 'Double line (stamp)']] },
      { k: 'range', id: 'weight', label: 'Weight', min: 0.2, max: 8, step: 0.1, def: 1.5, unit: ' %', dec: 1, show: function (p) { return p.frame !== 'none'; } },
      { k: 'range', id: 'margin', label: 'Margin', min: 0, max: 25, step: 0.5, def: 4, unit: ' %', dec: 1, show: function (p) { return p.frame !== 'none'; } },
      { k: 'color', id: 'color', label: 'Frame colour', def: '#111111', show: function (p) { return p.frame !== 'none'; } },
      { k: 'check', id: 'distressFrame', label: 'Distress the frame too', def: true, show: function (p) { return p.frame !== 'none' && p.effect === 'distress'; } }
    ],
    process: function (c) {
      var p = c.p, out = IM.copy(c.src);
      var framed = p.frame !== 'none';
      if (framed && p.distressFrame && p.effect === 'distress') out = frame(out, p);
      if (p.effect === 'distress') out = distress(out, p);
      else if (p.effect === 'texture') out = texture(out, p);
      if (framed && !(p.distressFrame && p.effect === 'distress')) out = frame(out, p);
      return out;
    }
  });
})();

</script>

<script>
/* Print sheets (gang sheets): lay several designs out on the roll and use the film well. */
(function () {
  'use strict';
  var el = NV.el, CM = 2.54;

  function pack(items, sheetW, gap, margin) {
    var usable = sheetW - margin * 2, units = [], out = [];
    items.forEach(function (it) {
      var wcm = it.cm, hcm = it.cm * it.img.height / it.img.width;
      for (var i = 0; i < it.qty; i++) units.push({ it: it, w: wcm, h: hcm });
    });
    units.sort(function (a, b) { return b.h - a.h; });
    var x = margin, y = margin, shelf = 0;
    units.forEach(function (u) {
      var w = u.w, h = u.h, rot = false;
      if (u.it.rot && w > usable && h <= usable) { var t = w; w = h; h = t; rot = true; }
      if (w > usable) { var k = usable / w; w *= k; h *= k; }
      if (x + w > margin + usable + 1e-6) { y += shelf + gap; x = margin; shelf = 0; }
      out.push({ it: u.it, x: x, y: y, w: w, h: h, rot: rot });
      x += w + gap;
      shelf = Math.max(shelf, h);
    });
    return { places: out, length: out.length ? y + shelf + margin : margin * 2 };
  }

  function draw(cv, st, packed, forExport) {
    var pxcm = forExport ? st.dpi / CM : cv.width / st.width;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = forExport && !st.background ? 'rgba(0,0,0,0)' : (forExport ? st.color : '#ffffff');
    if (forExport && !st.background) ctx.clearRect(0, 0, cv.width, cv.height);
    else ctx.fillRect(0, 0, cv.width, cv.height);
    packed.places.forEach(function (p) {
      ctx.save();
      if (p.rot) {
        ctx.translate(p.x * pxcm + p.w * pxcm, p.y * pxcm);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(p.it.img, 0, 0, p.h * pxcm, p.w * pxcm);
      } else {
        ctx.drawImage(p.it.img, p.x * pxcm, p.y * pxcm, p.w * pxcm, p.h * pxcm);
      }
      ctx.restore();
      if (!forExport) {
        ctx.strokeStyle = 'rgba(255,45,126,.45)';
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x * pxcm, p.y * pxcm, p.w * pxcm, p.h * pxcm);
      }
    });
    if (!forExport) {
      ctx.strokeStyle = 'rgba(120,120,120,.5)';
      ctx.setLineDash([6, 5]);
      ctx.strokeRect(st.margin * pxcm, st.margin * pxcm,
        (st.width - st.margin * 2) * pxcm, cv.height - st.margin * 2 * pxcm);
      ctx.setLineDash([]);
    }
  }

  NV.register({
    slug: 'gang-sheets',
    name: 'Print sheets',
    group: 'Production',
    tagline: 'Gang several designs onto the roll, measure the run and export at real DPI.',
    icon: NV.svg('<path d="M3 4h18v16H3z"/><path d="M3 10h9v10M12 4v6h9"/>'),
    kind: 'custom',
    render: function (host) {
      var t = this;
      var parts = NV.bench(host, t);
      var st = { width: 58, dpi: 300, gap: 0.5, margin: 0.5, background: false, color: '#ffffff' };
      var items = [], packed = { places: [], length: 1 };

      var wrap = el('div', { style: 'flex:1;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start' });
      var cv = el('canvas', { style: 'box-shadow:0 0 0 1px var(--line), 0 20px 50px -30px #000;background:#fff;max-width:100%' });
      wrap.appendChild(cv);
      var info = el('div', { class: 'meta' });
      parts.stage.appendChild(wrap); parts.stage.appendChild(info);

      var listBox = el('div', { style: 'display:flex;flex-direction:column;gap:10px' });
      var input = el('input', { type: 'file', accept: 'image/*', multiple: true, style: 'display:none' });
      input.addEventListener('change', function () {
        var files = [].slice.call(input.files);
        Promise.all(files.map(function (f) {
          return NV.loadImage(f).then(function (img) {
            return { name: f.name.replace(/\.[^.]+$/, ''), img: img, cm: 20, qty: 1, rot: true };
          });
        })).then(function (added) {
          items = items.concat(added);
          input.value = '';
          renderList(); update();
        });
      });

      function renderList() {
        listBox.innerHTML = '';
        if (!items.length) {
          listBox.appendChild(el('p', { class: 'hint', text: 'No designs yet. Add PNGs with a transparent background and set the width of each one in centimetres.' }));
          return;
        }
        items.forEach(function (it, i) {
          var row = el('div', { style: 'border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px' });
          var top = el('div', { style: 'display:flex;gap:10px;align-items:center' });
          var th = el('canvas', { width: 40, height: 40, style: 'flex:none;border-radius:4px;background:var(--ground)' });
          var tc = th.getContext('2d');
          var k = Math.min(40 / it.img.width, 40 / it.img.height);
          tc.drawImage(it.img, (40 - it.img.width * k) / 2, (40 - it.img.height * k) / 2, it.img.width * k, it.img.height * k);
          top.appendChild(th);
          top.appendChild(el('div', { style: 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px', text: it.name }));
          top.appendChild(el('button', {
            class: 'btn ghost', style: 'padding:4px 9px', text: '✕', title: 'Remove',
            onclick: function () { items.splice(i, 1); renderList(); update(); }
          }));
          row.appendChild(top);

          var g = el('div', { class: 'row' });
          var wIn = el('input', { type: 'number', value: it.cm, min: 1, max: 200, step: 0.5, title: 'Width in cm' });
          var qIn = el('input', { type: 'number', value: it.qty, min: 1, max: 200, step: 1, title: 'Quantity' });
          wIn.addEventListener('input', function () { it.cm = Math.max(0.5, +wIn.value || 1); update(); });
          qIn.addEventListener('input', function () { it.qty = Math.max(1, Math.min(200, +qIn.value || 1)); update(); });
          g.appendChild(el('label', { class: 'field' }, [el('span', { class: 'flabel', html: '<span>Width</span><b>cm</b>' }), wIn]));
          g.appendChild(el('label', { class: 'field' }, [el('span', { class: 'flabel', html: '<span>Quantity</span><b>pcs</b>' }), qIn]));
          row.appendChild(g);

          var rc = el('input', { type: 'checkbox' });
          rc.checked = it.rot;
          rc.addEventListener('change', function () { it.rot = rc.checked; update(); });
          row.appendChild(el('label', { class: 'check' }, [rc, el('span', { text: 'May rotate 90°' })]));
          listBox.appendChild(row);
        });
      }

      function update() {
        packed = pack(items, st.width, st.gap, st.margin);
        var length = Math.max(st.margin * 2 + 1, packed.length);
        var pxcm = 900 / st.width;
        cv.width = Math.round(st.width * pxcm);
        cv.height = Math.max(40, Math.round(length * pxcm));
        cv.style.width = Math.min(900, cv.width) + 'px';
        draw(cv, st, packed, false);
        var used = packed.places.reduce(function (a, p) { return a + p.w * p.h; }, 0);
        var sheet = st.width * length;
        info.textContent = packed.places.length + ' pieces · ' + length.toFixed(1) + ' cm long (' +
          (length / 100).toFixed(2) + ' m) · ' + Math.round(used / sheet * 100) + ' % used';
      }

      NV.controls(parts.body, [
        { k: 'select', id: 'width', label: 'Roll width', def: '58', opts: [['30', '30 cm'], ['33', '33 cm'], ['40', '40 cm'], ['55', '55 cm'], ['58', '58 cm'], ['60', '60 cm'], ['62', '62 cm']] },
        { k: 'num', id: 'dpi', label: 'Output resolution', unit: 'DPI', def: 300, min: 100, max: 720, step: 10 },
        { k: 'range', id: 'gap', label: 'Gap between pieces', min: 0, max: 4, step: 0.1, def: 0.5, unit: ' cm', dec: 1 },
        { k: 'range', id: 'margin', label: 'Roll margin', min: 0, max: 4, step: 0.1, def: 0.5, unit: ' cm', dec: 1 },
        { k: 'check', id: 'background', label: 'Export with a solid background', def: false },
        { k: 'color', id: 'color', label: 'Background colour', def: '#ffffff', show: function (p) { return p.background; } }
      ], st, function () { st.width = +st.width; update(); }).sync();

      parts.body.appendChild(el('div', { class: 'sep' }));
      parts.body.appendChild(el('div', { class: 'group-t', text: 'Designs on the sheet' }));
      parts.body.appendChild(el('button', { class: 'btn wide', text: 'Add designs', onclick: function () { input.click(); } }));
      parts.body.appendChild(input);
      parts.body.appendChild(listBox);
      parts.body.appendChild(el('p', { class: 'hint', text: 'The layout uses shelves by height, the same way a RIP does: sort tallest first and fill each row.' }));

      parts.foot.appendChild(el('button', {
        class: 'btn primary wide', text: 'Download sheet PNG',
        onclick: function () {
          if (!items.length) return NV.toast('Add at least one design.', 'bad');
          var length = packed.length, pxcm = st.dpi / CM;
          var W = Math.round(st.width * pxcm), H = Math.round(length * pxcm);
          if (W * H > 160e6) return NV.toast('That sheet is enormous at ' + st.dpi + ' DPI. Lower the DPI or split the order.', 'bad');
          var out = document.createElement('canvas');
          out.width = W; out.height = H;
          draw(out, st, packed, true);
          NV.blobOf(out).then(function (b) { return NV.pngWithDpi(b, st.dpi); })
            .then(function (b) {
              NV.download(b, 'sheet-' + st.width + 'cm-' + length.toFixed(0) + 'cm.png');
              NV.toast('Sheet of ' + W + ' × ' + H + ' px ready.', 'ok');
            });
        }
      }));
      parts.foot.appendChild(el('button', {
        class: 'btn ghost wide', text: 'Download list (CSV)',
        onclick: function () {
          var rows = [['Design', 'Width cm', 'Height cm', 'Quantity', 'Area cm2']];
          items.forEach(function (it) {
            var h = it.cm * it.img.height / it.img.width;
            rows.push([it.name, it.cm.toFixed(1), h.toFixed(1), it.qty, (it.cm * h * it.qty).toFixed(1)]);
          });
          rows.push([]);
          rows.push(['Total length cm', packed.length.toFixed(1)]);
          rows.push(['Roll width cm', st.width]);
          var csv = rows.map(function (r) { return r.join(','); }).join('\n');
          NV.download(new Blob([csv], { type: 'text/csv' }), 'print-sheet.csv');
        }
      }));

      renderList(); update();
    }
  });
})();
